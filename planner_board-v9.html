      // --- CRUD Nodes & Edges ---
      function addNode(wx, wy, text = '', bgColor = null, autoEdit = true, shape = null) {
        const dn = settings.defaultNode;
        const useShape = shape || dn.shape || 'process';
        const useBg = bgColor || dn.bgColor || '#ffffff';
        const useAutoBorder = bgColor ? true : !!dn.autoBorder;
        const useBorder = useAutoBorder ? deriveBorderColor(useBg) : (dn.borderColor || deriveBorderColor(useBg));
        const useText = dn.textColor || '#0f172a';
        const isCompact = useShape === 'connector';
        const w = isCompact ? 76 : (useShape === 'offpage' ? 110 : 210);
        const h = isCompact ? 76 : (useShape === 'decision' ? 96 : (useShape === 'database' ? 84 : 68));
        const node = {
          id: uid('n'),
          x: Math.round(wx - w / 2),
          y: Math.round(wy - h / 2),
          w,
          h,
          text,
          shape: useShape,
          rotate: 0,
          flipX: false,
          flipY: false,
          bgColor: useBg,
          borderColor: useBorder,
          autoBorder: useAutoBorder,
          textColor: useText,
          fontSize: 14
        };
        state.nodes.push(node);
        renderNodes();
        selectSingleNode(node.id);
        pushHistory();
        if (autoEdit) startEditingNode(node.id);
        return node;
      }

      // Pick a nice non-overlapping t along a side when adding multiple arrows via click-click
      function pickDistributedT(nodeId, side) {
        const used = [];
        state.edges.forEach(e => {
          if (e.from.nodeId === nodeId && e.from.side === side) used.push(e.from.t);
          if (e.to.nodeId === nodeId && e.to.side === side) used.push(e.to.t);
        });
        const candidates = [0.5, 0.28, 0.72, 0.14, 0.86, 0.39, 0.61, 0.21, 0.79];
        for (const c of candidates) {
          if (!used.some(u => Math.abs(u - c) < 0.08)) return c;
        }
        return clamp(0.15 + Math.random() * 0.7, 0.1, 0.9);
      }

      function addEdge(fromObj, toObj) {
        const de = settings.defaultEdge;
        const lineStyle = VALID_LINE_STYLES.includes(de.lineStyle) ? de.lineStyle : 'solid';
        const curveType = VALID_ROUTES.includes(de.curveType) ? de.curveType : 'smooth';
        const startHead = VALID_HEADS.includes(de.startHead) ? de.startHead : 'none';
        const endHead = VALID_HEADS.includes(de.endHead) ? de.endHead : 'triangle';
        const edge = {
          id: uid('e'),
          from: { ...fromObj },
          to: { ...toObj },
          points: [],
          color: de.color || '#64748b',
          width: clamp(Number(de.width) || 2.5, 1, 10),
          lineStyle,
          dashed: lineStyle === 'dashed',
          curveType,
          startHead,
          endHead,
          arrowStart: startHead !== 'none',
          arrowEnd: endHead !== 'none',
          label: ''
        };
        state.edges.push(edge);
        selectEdge(edge.id);
        pushHistory();
        return edge;
      }

      function addAutoEdgeBetweenNodes(fromId, toId) {
        const fromNode = getNode(fromId);
        const toNode = getNode(toId);
        if (!fromNode || !toNode) return null;

        if (fromId === toId) {
          // Allow self-loop too!
          const { w, h } = getNodeSize(fromNode);
          const edge = addEdge(
            { nodeId: fromId, side: 'right', t: 0.3, x: 0, y: 0 },
            { nodeId: toId, side: 'top', t: 0.7, x: 0, y: 0 }
          );
          edge.points = [{ x: fromNode.x + w + 48, y: fromNode.y - 36 }];
          renderEdges();
          pushHistory();
          return edge;
        }

        const { fromSide, toSide } = resolveAutoSides(fromNode, toNode);
        const tFrom = pickDistributedT(fromId, fromSide);
        const tTo = pickDistributedT(toId, toSide);
        return addEdge(
          { nodeId: fromId, side: fromSide, t: tFrom, x: 0, y: 0 },
          { nodeId: toId, side: toSide, t: tTo, x: 0, y: 0 }
        );
      }

      function deleteSelected() {
        closeRgbPopover(false);
        if (selectedNodeIds.size > 0) {
          const ids = new Set(selectedNodeIds);
          state.nodes = state.nodes.filter(n => !ids.has(n.id));
          state.edges = state.edges.filter(e => !ids.has(e.from.nodeId) && !ids.has(e.to.nodeId));
          selectedNodeIds.clear();
          renderAll();
          pushHistory();
        } else if (selectedEdgeId) {
          state.edges = state.edges.filter(e => e.id !== selectedEdgeId);
          selectedEdgeId = null;
          renderAll();
          pushHistory();
        }
      }

      function pluralRu(n, one, few, many) {
        const mod10 = n % 10;
        const mod100 = n % 100;
        if (mod10 === 1 && mod100 !== 11) return `${n} ${one}`;
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return `${n} ${few}`;
        return `${n} ${many}`;
      }

      function cloneNodesAndInternalEdges(sourceNodes, sourceEdges, offsetX, offsetY) {
        const idMap = new Map();
        const newNodes = [];

        sourceNodes.forEach(src => {
          const newId = uid('n');
          idMap.set(src.id, newId);
          newNodes.push({
            ...src,
            id: newId,
            x: Math.round(src.x + offsetX),
            y: Math.round(src.y + offsetY)
          });
        });

        const newEdges = [];
        sourceEdges.forEach(srcEdge => {
          const newFromId = srcEdge.from && srcEdge.from.nodeId ? idMap.get(srcEdge.from.nodeId) : null;
          const newToId = srcEdge.to && srcEdge.to.nodeId ? idMap.get(srcEdge.to.nodeId) : null;
          if (!newFromId || !newToId) return;

          newEdges.push({
            ...srcEdge,
            id: uid('e'),
            from: {
              ...srcEdge.from,
              nodeId: newFromId,
              x: Math.round((srcEdge.from.x || 0) + offsetX),
              y: Math.round((srcEdge.from.y || 0) + offsetY)
            },
            to: {
              ...srcEdge.to,
              nodeId: newToId,
              x: Math.round((srcEdge.to.x || 0) + offsetX),
              y: Math.round((srcEdge.to.y || 0) + offsetY)
            },
            points: (srcEdge.points || []).map(p => ({
              x: Math.round(p.x + offsetX),
              y: Math.round(p.y + offsetY)
            }))
          });
        });

        return { newNodes, newEdges };
      }

      function copySelectedNodes() {
        if (selectedNodeIds.size === 0) return false;
        const nodesToCopy = state.nodes
          .filter(n => selectedNodeIds.has(n.id))
          .map(n => ({ ...n }));
        if (nodesToCopy.length === 0) return false;

        const edgesToCopy = state.edges
          .filter(e =>
            e.from.nodeId && selectedNodeIds.has(e.from.nodeId) &&
            e.to.nodeId && selectedNodeIds.has(e.to.nodeId)
          )
          .map(e => ({
            ...e,
            from: { ...e.from },
            to: { ...e.to },
            points: (e.points || []).map(p => ({ x: p.x, y: p.y }))
          }));

        clipboard = {
          nodes: nodesToCopy,
          edges: edgesToCopy,
          pasteCount: 0
        };

        const msg = edgesToCopy.length > 0
          ? `Скопировано: ${pluralRu(nodesToCopy.length, 'блок', 'блока', 'блоков')} и ${pluralRu(edgesToCopy.length, 'стрелка', 'стрелки', 'стрелок')}`
          : `Скопировано: ${pluralRu(nodesToCopy.length, 'блок', 'блока', 'блоков')}`;
        showToast(msg);
        return true;
      }

      function pasteClipboard() {
        if (!clipboard || !clipboard.nodes || clipboard.nodes.length === 0) return false;
        finishEditing();
        closeRgbPopover(true);
        hideMagneticPort();

        clipboard.pasteCount += 1;
        const offset = 36 * clipboard.pasteCount;
        const { newNodes, newEdges } = cloneNodesAndInternalEdges(clipboard.nodes, clipboard.edges, offset, offset);

        newNodes.forEach(n => state.nodes.push(n));
        newEdges.forEach(e => state.edges.push(e));

        selectedNodeIds = new Set(newNodes.map(n => n.id));
        selectedEdgeId = null;
        syncHeadSourceToggleUI();
        renderAll();
        pushHistory();

        const msg = newEdges.length > 0
          ? `Вставлено: ${pluralRu(newNodes.length, 'блок', 'блока', 'блоков')} и ${pluralRu(newEdges.length, 'стрелка', 'стрелки', 'стрелок')}`
          : `Вставлено: ${pluralRu(newNodes.length, 'блок', 'блока', 'блоков')}`;
        showToast(msg);
        return true;
      }

      function duplicateSelectedNodes() {
        if (selectedNodeIds.size === 0) return;
        closeRgbPopover(true);
        const srcNodes = state.nodes.filter(n => selectedNodeIds.has(n.id));
        const srcEdges = state.edges.filter(e =>
          e.from.nodeId && selectedNodeIds.has(e.from.nodeId) &&
          e.to.nodeId && selectedNodeIds.has(e.to.nodeId)
        );
        const { newNodes, newEdges } = cloneNodesAndInternalEdges(srcNodes, srcEdges, 36, 36);
        newNodes.forEach(n => state.nodes.push(n));
        newEdges.forEach(e => state.edges.push(e));

        selectedNodeIds = new Set(newNodes.map(n => n.id));
        selectedEdgeId = null;
        renderAll();
        pushHistory();
      }

      // --- Connect Mode ---
      function setConnectMode(active, preselectedSourceId = null) {
        connectMode = active;
        connectSourceId = active ? preselectedSourceId : null;
        btnConnect.classList.toggle('btn-active', active);
        boardEl.classList.toggle('connect-mode', active);
        modeBanner.classList.toggle('visible', active);
        if (active) {
          hideMagneticPort();
          closeRgbPopover(true);
          modeBannerText.textContent = connectSourceId
            ? 'Теперь кликните по целевому блоку'
            : 'Кликните по первому блоку для стрелки';
        }
        syncSelectionVisuals();
      }

      function handleConnectModeClick(nodeId) {
        if (!connectSourceId) {
          connectSourceId = nodeId;
          modeBannerText.textContent = 'Теперь кликните по целевому блоку (можно и по этому же)';
          syncSelectionVisuals();
        } else {
          addAutoEdgeBetweenNodes(connectSourceId, nodeId);
          setConnectMode(false);
        }
      }

      // --- Board Pointer Events ---
      boardEl.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 && e.button !== 1) return;
        finishEditing();
        closeRgbPopover(true);
        hideMagneticPort();

        if (connectMode) {
          setConnectMode(false);
          return;
        }

        // Ctrl/Shift + Drag on empty canvas -> Marquee Multi-Select
        if ((e.shiftKey || e.ctrlKey || e.metaKey) && e.button === 0) {
          boardEl.classList.add('marquee-mode');
          dragState = {
            type: 'marquee',
            baseSelection: (e.ctrlKey || e.metaKey) ? new Set(selectedNodeIds) : new Set(),
            startClientX: e.clientX,
            startClientY: e.clientY,
            curClientX: e.clientX,
            curClientY: e.clientY
          };
          marqueeBoxEl.style.left = e.clientX + 'px';
          marqueeBoxEl.style.top = e.clientY + 'px';
          marqueeBoxEl.style.width = '0px';
          marqueeBoxEl.style.height = '0px';
          marqueeBoxEl.style.display = 'block';
          return;
        }

        clearSelection();
        boardEl.classList.add('panning');
        dragState = {
          type: 'pan',
          startClientX: e.clientX,
          startClientY: e.clientY,
          startViewX: view.x,
          startViewY: view.y
        };
      });

      window.addEventListener('pointermove', (e) => {
        if (!dragState) {
          updateMagneticPort(e.clientX, e.clientY);
          return;
        }

        if (dragState.type === 'pan') {
          view.x = dragState.startViewX + (e.clientX - dragState.startClientX);
          view.y = dragState.startViewY + (e.clientY - dragState.startClientY);
          updateTransform();
        } else if (dragState.type === 'marquee') {
          dragState.curClientX = e.clientX;
          dragState.curClientY = e.clientY;
          const x1 = Math.min(dragState.startClientX, e.clientX);
          const y1 = Math.min(dragState.startClientY, e.clientY);
          const x2 = Math.max(dragState.startClientX, e.clientX);
          const y2 = Math.max(dragState.startClientY, e.clientY);
          marqueeBoxEl.style.left = x1 + 'px';
          marqueeBoxEl.style.top = y1 + 'px';
          marqueeBoxEl.style.width = (x2 - x1) + 'px';
          marqueeBoxEl.style.height = (y2 - y1) + 'px';

          const w1 = screenToWorld(x1, y1);
          const w2 = screenToWorld(x2, y2);
          selectedNodeIds = new Set(dragState.baseSelection || []);
          selectedEdgeId = null;
          state.nodes.forEach(n => {
            const { w, h } = getNodeSize(n);
            if (n.x + w >= w1.x && n.x <= w2.x && n.y + h >= w1.y && n.y <= w2.y) {
              selectedNodeIds.add(n.id);
            }
          });
          syncSelectionVisuals();
        } else if (dragState.type === 'node') {
          const dx = (e.clientX - dragState.startClientX) / view.zoom;
          const dy = (e.clientY - dragState.startClientY) / view.zoom;
          if (!dragState.moved && Math.hypot(dx, dy) > 3) {
            dragState.moved = true;
            dragState.moveIds.forEach(id => {
              const el = nodesLayer.querySelector(`.node[data-id="${id}"]`);
              if (el) el.classList.add('dragging');
            });
            updateContextBars();
          }
          if (dragState.moved) {
            dragState.moveIds.forEach(id => {
              const node = getNode(id);
              const initPos = dragState.initialPositions[id];
              if (!node || !initPos) return;
              node.x = Math.round(initPos.x + dx);
              node.y = Math.round(initPos.y + dy);
              const el = nodesLayer.querySelector(`.node[data-id="${node.id}"]`);
              if (el) {
                el.style.left = node.x + 'px';
                el.style.top = node.y + 'px';
              }
            });
            // Shift internal & half-free group edges' bend points and free endpoints together
            Object.entries(dragState.movingEdgeData).forEach(([edgeId, data]) => {
              const edge = getEdge(edgeId);
              if (!edge) return;
              if (data.points.length > 0) {
                edge.points = data.points.map(p => ({ x: Math.round(p.x + dx), y: Math.round(p.y + dy) }));
              }
              if (data.moveFreeFrom) {
                edge.from.x = Math.round(data.moveFreeFrom.x + dx);
                edge.from.y = Math.round(data.moveFreeFrom.y + dy);
              }
              if (data.moveFreeTo) {
                edge.to.x = Math.round(data.moveFreeTo.x + dx);
                edge.to.y = Math.round(data.moveFreeTo.y + dy);
              }
            });
            renderEdges();
          }
        } else if (dragState.type === 'resize') {
          const dx = (e.clientX - dragState.startClientX) / view.zoom;
          const dy = (e.clientY - dragState.startClientY) / view.zoom;
          dragState.moved = true;
          const node = getNode(dragState.nodeId);
          if (!node) return;
          const minW = (node.shape === 'connector' || node.shape === 'offpage') ? 54 : 76;
          let nw = Math.max(minW, Math.round(dragState.startW + dx));
          let nh = Math.max(44, Math.round(dragState.startH + dy));
          if (e.shiftKey) {
            const side = Math.max(minW, Math.round((nw + nh) / 2));
            nw = side;
            nh = side;
          }
          node.w = nw;
          node.h = nh;
          const el = nodesLayer.querySelector(`.node[data-id="${node.id}"]`);
          if (el) {
            applyNodeStyles(el, node);
          }
          renderEdges();
        } else if (dragState.type === 'new-edge') {
          updateNewEdgePreview(e.clientX, e.clientY);
        } else if (dragState.type === 'edge-stretch') {
          const distScreen = Math.hypot(e.clientX - dragState.startClientX, e.clientY - dragState.startClientY);
          if (!dragState.moved && distScreen > 4) {
            dragState.moved = true;
            const edge = getEdge(dragState.edgeId);
            if (edge && dragState.waypointIndex === -1) {
              const segIdx = findClosestSegmentIndex(edge, dragState.startWorld.x, dragState.startWorld.y);
              edge.points.splice(segIdx, 0, { x: Math.round(dragState.startWorld.x), y: Math.round(dragState.startWorld.y) });
              dragState.waypointIndex = segIdx;
              dragState.inserted = true;
            }
            updateContextBars();
          }
          if (dragState.moved) {
            const edge = getEdge(dragState.edgeId);
            if (!edge || dragState.waypointIndex < 0 || dragState.waypointIndex >= edge.points.length) return;
            const pt = screenToWorld(e.clientX, e.clientY);
            edge.points[dragState.waypointIndex] = { x: Math.round(pt.x), y: Math.round(pt.y) };
            renderEdges();
          }
        } else if (dragState.type === 'edge-waypoint') {
          const edge = getEdge(dragState.edgeId);
          if (!edge || !edge.points[dragState.index]) return;
          dragState.moved = true;
          const pt = screenToWorld(e.clientX, e.clientY);
          edge.points[dragState.index] = { x: Math.round(pt.x), y: Math.round(pt.y) };
          renderEdges();
          updateContextBars();
        } else if (dragState.type === 'edge-end') {
          const edge = getEdge(dragState.edgeId);
          if (!edge) return;
          if (!dragState.moved) {
            if (Math.hypot(e.clientX - dragState.startClientX, e.clientY - dragState.startClientY) < 3) {
              return;
            }
            dragState.moved = true;
            hideMagneticPort();
          }
          const pt = screenToWorld(e.clientX, e.clientY);
          const snap = findSnapNodePerimeter(pt.x, pt.y, 20 / view.zoom);
          showSnapIndicator(snap);

          if (snap) {
            edge[dragState.which] = { nodeId: snap.nodeId, side: snap.side, t: snap.t, u: snap.u, x: snap.x, y: snap.y };
          } else {
            edge[dragState.which] = { nodeId: null, side: 'auto', t: 0.5, u: null, x: Math.round(pt.x), y: Math.round(pt.y) };
          }
          renderEdges();
          updateContextBars();
        }
      });

      window.addEventListener('pointerup', (e) => {
        if (!dragState) return;
        const finished = dragState;
        dragState = null;

        if (finished.type === 'pan') {
          boardEl.classList.remove('panning');
          saveToStorage();
        } else if (finished.type === 'marquee') {
          boardEl.classList.remove('marquee-mode');
          marqueeBoxEl.style.display = 'none';
          renderEdges();
          updateContextBars();
        } else if (finished.type === 'node') {
          finished.moveIds.forEach(id => {
            const el = nodesLayer.querySelector(`.node[data-id="${id}"]`);
            if (el) el.classList.remove('dragging');
          });
          if (finished.moved) pushHistory();
          updateContextBars();
        } else if (finished.type === 'resize') {
          if (finished.moved) pushHistory();
          updateContextBars();
        } else if (finished.type === 'new-edge') {
          previewEdgeEl.style.display = 'none';
          showSnapIndicator(null);
          const pt = screenToWorld(e.clientX, e.clientY);
          const snap = finished.snapTarget;
          const draggedDist = Math.hypot(pt.x - finished.startPt.x, pt.y - finished.startPt.y);

          if (snap) {
            // Check not accidental zero-length drop on exact same spot
            const sameSpot = snap.nodeId === finished.from.nodeId && Math.hypot(snap.x - finished.startPt.x, snap.y - finished.startPt.y) < 12;
            if (!sameSpot) {
              addEdge(finished.from, { nodeId: snap.nodeId, side: snap.side, t: snap.t, u: snap.u, x: snap.x, y: snap.y });
            }
          } else if (draggedDist > 26) {
            // Free-ended arrow dropped on open canvas!
            addEdge(finished.from, { nodeId: null, side: 'auto', t: 0.5, u: null, x: Math.round(pt.x), y: Math.round(pt.y) });
          }
          updateContextBars();
        } else if (finished.type === 'edge-stretch' || finished.type === 'edge-waypoint') {
          if (finished.moved) pushHistory();
          updateContextBars();
        } else if (finished.type === 'edge-end') {
          showSnapIndicator(null);
          if (finished.moved) pushHistory();
          updateContextBars();
        }
      });

      // Double-click empty board -> create block right there
      boardEl.addEventListener('dblclick', (e) => {
        if (e.target !== boardEl) return;
        if (connectMode) return;
        const pt = screenToWorld(e.clientX, e.clientY);
        addNode(pt.x, pt.y, '', null, true, null);
      });

      // Wheel Zoom
      boardEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        closeRgbPopover(true);
        const factor = e.deltaY < 0 ? 1.1 : 0.91;
        zoomAt(view.zoom * factor, e.clientX, e.clientY);
      }, { passive: false });

      function zoomAt(targetZoom, clientX, clientY) {
        const clamped = clamp(targetZoom, 0.2, 2.8);
        const rect = boardEl.getBoundingClientRect();
        const cx = clientX - rect.left;
        const cy = clientY - rect.top;
        const wx = (cx - view.x) / view.zoom;
        const wy = (cy - view.y) / view.zoom;

        view.zoom = clamped;
        view.x = cx - wx * view.zoom;
        view.y = cy - wy * view.zoom;
        updateTransform();
        saveToStorage();
      }

      function fitToScreen() {
        closeRgbPopover(true);
        if (state.nodes.length === 0) {
          view = { x: 0, y: 0, zoom: 1 };
          updateTransform();
          saveToStorage();
          return;
        }
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        state.nodes.forEach(n => {
          const { w, h } = getNodeSize(n);
          minX = Math.min(minX, n.x);
          minY = Math.min(minY, n.y);
          maxX = Math.max(maxX, n.x + w);
          maxY = Math.max(maxY, n.y + h);
        });
        state.edges.forEach(e => {
          e.points.forEach(p => {
            minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
            maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
          });
        });

        const pad = 90;
        const contentW = Math.max(100, maxX - minX);
        const contentH = Math.max(100, maxY - minY);
        const rect = boardEl.getBoundingClientRect();
        const scale = Math.min(1.2, Math.min((rect.width - pad * 2) / contentW, (rect.height - pad * 2) / contentH));

        view.zoom = Math.max(0.25, scale);
        view.x = rect.width / 2 - ((minX + maxX) / 2) * view.zoom;
        view.y = rect.height / 2 - ((minY + maxY) / 2) * view.zoom;
        updateTransform();
        saveToStorage();
      }

      // --- Toolbar & Context Bar Wiring ---
      btnAdd.addEventListener('click', () => {
        finishEditing();
        closeRgbPopover(true);
        setConnectMode(false);
        const rect = boardEl.getBoundingClientRect();
        const center = screenToWorld(rect.width / 2, rect.height / 2);
        addNode(center.x + (Math.random() - 0.5) * 80, center.y + (Math.random() - 0.5) * 60, '', null, true, null);
      });

      btnDefNodeShape.addEventListener('click', (e) => {
        finishEditing();
        openNodeShapePopover(e.currentTarget, 'default');
      });

      btnDefNodeColor.addEventListener('click', (e) => {
        finishEditing();
        openRgbPopover('default-node', e.currentTarget);
      });

      btnDefEdgeStyle.addEventListener('click', (e) => {
        finishEditing();
        openEdgeStylePopover('default-edge', e.currentTarget);
      });

      btnDefEdgeColor.addEventListener('click', (e) => {
        finishEditing();
        openRgbPopover('default-edge', e.currentTarget);
      });

      btnConnect.addEventListener('click', () => {
        finishEditing();
        closeRgbPopover(true);
        setConnectMode(!connectMode);
      });

      document.getElementById('btn-cancel-mode').addEventListener('click', () => setConnectMode(false));
      btnUndo.addEventListener('click', undo);
      btnRedo.addEventListener('click', redo);

      document.getElementById('btn-zoom-in').addEventListener('click', () => zoomAt(view.zoom * 1.18, window.innerWidth / 2, window.innerHeight / 2));
      document.getElementById('btn-zoom-out').addEventListener('click', () => zoomAt(view.zoom / 1.18, window.innerWidth / 2, window.innerHeight / 2));
      zoomLabel.addEventListener('click', () => zoomAt(1, window.innerWidth / 2, window.innerHeight / 2));
      document.getElementById('btn-fit').addEventListener('click', fitToScreen);

      // Node Context Bar
      document.getElementById('ctx-node-shape').addEventListener('click', (e) => openNodeShapePopover(e.currentTarget));
      document.getElementById('ctx-node-rot').addEventListener('click', () => {
        rotateSelectedNodes(90);
        if (nodeShapePopover.classList.contains('visible')) renderNodeShapePopoverContents();
      });
      document.getElementById('ctx-node-flipx').addEventListener('click', () => {
        flipSelectedNodes('x');
        if (nodeShapePopover.classList.contains('visible')) renderNodeShapePopoverContents();
      });
      document.getElementById('ctx-node-flipy').addEventListener('click', () => {
        flipSelectedNodes('y');
        if (nodeShapePopover.classList.contains('visible')) renderNodeShapePopoverContents();
      });
      document.getElementById('ctx-node-bg').addEventListener('click', (e) => openRgbPopover('node-bg', e.currentTarget));
      document.getElementById('ctx-node-text').addEventListener('click', (e) => openRgbPopover('node-text', e.currentTarget));
      document.getElementById('ctx-node-edges').addEventListener('click', (e) => openRgbPopover('node-edges', e.currentTarget));

      function adjustSelectedFontSize(delta) {
        if (selectedNodeIds.size === 0) return;
        selectedNodeIds.forEach(id => {
          const n = getNode(id);
          if (!n) return;
          n.fontSize = clamp((n.fontSize || 14) + delta, 10, 40);
          const el = nodesLayer.querySelector(`.node[data-id="${n.id}"]`);
          if (el) applyNodeStyles(el, n);
        });
        renderEdges();
        updateContextBars();
        pushHistory();
      }

      document.getElementById('ctx-font-dec').addEventListener('click', () => adjustSelectedFontSize(-2));
      document.getElementById('ctx-font-inc').addEventListener('click', () => adjustSelectedFontSize(2));

      document.getElementById('ctx-node-connect').addEventListener('click', () => {
        if (selectedNodeIds.size !== 1) return;
        const src = Array.from(selectedNodeIds)[0];
        clearSelection();
        setConnectMode(true, src);
      });

      document.getElementById('ctx-node-dup').addEventListener('click', duplicateSelectedNodes);
      document.getElementById('ctx-node-del').addEventListener('click', deleteSelected);

      // Edge Context Bar
      document.getElementById('ctx-edge-color').addEventListener('click', (e) => openRgbPopover('edge', e.currentTarget));

      function adjustEdgeWidth(delta) {
        const edge = getEdge(selectedEdgeId);
        if (!edge) return;
        edge.width = clamp(Math.round((edge.width + delta) * 2) / 2, 1, 10);
        renderEdges();
        updateContextBars();
        pushHistory();
      }

      document.getElementById('ctx-edge-w-dec').addEventListener('click', () => adjustEdgeWidth(-0.5));
      document.getElementById('ctx-edge-w-inc').addEventListener('click', () => adjustEdgeWidth(0.5));

      document.getElementById('ctx-edge-curve').addEventListener('click', (e) => {
        openEdgeStylePopover('route', e.currentTarget);
      });

      document.getElementById('ctx-edge-style').addEventListener('click', (e) => {
        openEdgeStylePopover('line', e.currentTarget);
      });

      document.getElementById('ctx-edge-heads').addEventListener('click', (e) => {
        openEdgeStylePopover('heads', e.currentTarget);
      });

      btnHeadSourceColor.addEventListener('click', () => {
        settings.headColorFromSource = !settings.headColorFromSource;
        syncHeadSourceToggleUI();
        renderEdges();
        saveToStorage();
        showToast(
          settings.headColorFromSource
            ? 'Наконечники: в цвет исходного блока'
            : 'Наконечники: в цвет стрелки'
        );
      });

      document.getElementById('ctx-edge-flip').addEventListener('click', () => {
        const edge = getEdge(selectedEdgeId);
        if (!edge) return;
        const tmp = edge.from;
        edge.from = edge.to;
        edge.to = tmp;
        edge.points.reverse();
        renderEdges();
        updateContextBars();
        pushHistory();
      });

      document.getElementById('ctx-edge-label').addEventListener('click', () => {
        const edge = getEdge(selectedEdgeId);
        if (!edge) return;
        const geom = buildEdgeGeometry(edge);
        startEditingEdgeLabel(edge.id, geom.midX, geom.midY);
      });

      document.getElementById('ctx-edge-straighten').addEventListener('click', () => {
        const edge = getEdge(selectedEdgeId);
        if (!edge) return;
        edge.points = [];
        renderEdges();
        updateContextBars();
        pushHistory();
      });

      document.getElementById('ctx-edge-del').addEventListener('click', deleteSelected);

      // --- Save / Load JSON ---
      btnSave.addEventListener('click', () => {
        finishEditing();
        closeRgbPopover(true);
        const data = JSON.stringify({ version: 4, state, view, settings }, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `plan-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Схема сохранена в JSON');
      });

      btnLoad.addEventListener('click', () => {
        finishEditing();
        closeRgbPopover(true);
        fileInput.value = '';
        fileInput.click();
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            const rawState = parsed.state || parsed;
            if (!Array.isArray(rawState.nodes) || !Array.isArray(rawState.edges)) {
              throw new Error('Неверный формат');
            }
            state = normalizeState(rawState);
            if (parsed.settings && typeof parsed.settings === 'object') {
              normalizeSettings(parsed.settings);
              syncHeadSourceToggleUI();
              syncToolbarDefaultsUI();
            }
            selectedNodeIds.clear();
            selectedEdgeId = null;
            renderAll();
            pushHistory();
            fitToScreen();
            showToast('Схема загружена');
          } catch (err) {
            alert('Не удалось открыть файл. Выберите файл .json, сохранённый в этой программе.');
          }
        };
        reader.readAsText(file);
      });

      btnClear.addEventListener('click', () => {
        if (state.nodes.length === 0 && state.edges.length === 0) return;
        if (!confirm('Очистить всю доску? Действие можно отменить кнопкой «Отменить».')) return;
        finishEditing();
        closeRgbPopover(false);
        state = { nodes: [], edges: [] };
        selectedNodeIds.clear();
        selectedEdgeId = null;
        renderAll();
        pushHistory();
        showToast('Доска очищена');
      });

      // --- Shared Export Helpers (Bounds, Word-Break Wrapping, XML Escaping) ---
      const EXPORT_FONT_FAMILY = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, sans-serif';

      function escapeXml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&apos;');
      }

      function wrapTextLines(ctx, text, maxW) {
        const safeMaxW = Math.max(20, maxW);
        const paragraphs = (text || '').split('\n');
        const lines = [];

        const pushBrokenWord = (word) => {
          let chunk = '';
          for (const ch of word) {
            const test = chunk + ch;
            if (ctx.measureText(test).width > safeMaxW && chunk) {
              lines.push(chunk);
              chunk = ch;
            } else {
              chunk = test;
            }
          }
          return chunk;
        };

        paragraphs.forEach(p => {
          if (p === '') {
            lines.push('');
            return;
          }
          const words = p.split(' ');
          let line = '';
          for (let i = 0; i < words.length; i++) {
            const word = words[i];
            const test = line ? line + ' ' + word : word;
            if (ctx.measureText(test).width <= safeMaxW) {
              line = test;
            } else {
              if (line) {
                lines.push(line);
                line = '';
              }
              if (ctx.measureText(word).width > safeMaxW) {
                line = pushBrokenWord(word);
              } else {
                line = word;
              }
            }
          }
          lines.push(line);
        });

        return lines;
      }

      function computeExportBounds(measureCtx) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        const expand = (x, y, margin = 0) => {
          minX = Math.min(minX, x - margin);
          minY = Math.min(minY, y - margin);
          maxX = Math.max(maxX, x + margin);
          maxY = Math.max(maxY, y + margin);
        };

        state.nodes.forEach(n => {
          const { w, h } = getNodeSize(n);
          expand(n.x, n.y, 4);
          expand(n.x + w, n.y + h, 4);
        });

        state.edges.forEach(e => {
          const geom = buildEdgeGeometry(e);
          const sw = e.width || 2.5;
          const headPad = Math.max(14, sw * 5);

          geom.segments.forEach(seg => {
            if (seg.type === 'cubic') {
              const steps = 24;
              for (let s = 0; s <= steps; s++) {
                const pt = evalCubic(seg.p0, seg.cp1, seg.cp2, seg.p1, s / steps);
                expand(pt.x, pt.y, headPad);
              }
            } else {
              expand(seg.p0.x, seg.p0.y, headPad);
              expand(seg.p1.x, seg.p1.y, headPad);
            }
          });

          if (e.label && e.label.trim()) {
            measureCtx.font = `500 12px ${EXPORT_FONT_FAMILY}`;
            const tw = measureCtx.measureText(e.label).width;
            const halfW = (tw + 22) / 2;
            const halfH = 14;
            expand(geom.midX - halfW, geom.midY - halfH, 2);
            expand(geom.midX + halfW, geom.midY + halfH, 2);
          }
        });

        if (!Number.isFinite(minX)) {
          minX = 0; minY = 0; maxX = 400; maxY = 300;
        }

        const pad = 64;
        const width = Math.ceil(maxX - minX + pad * 2);
        const height = Math.ceil(maxY - minY + pad * 2);
        return { minX, minY, maxX, maxY, width, height, pad };
      }

      // --- PNG Export (adaptive DPR, word-break wrapping & full curve bounds) ---
      btnPng.addEventListener('click', () => {
        finishEditing();
        closeRgbPopover(true);
        if (state.nodes.length === 0 && state.edges.length === 0) {
          showToast('На доске пока пусто');
          return;
        }

        const measureCanvas = document.createElement('canvas');
        const measureCtx = measureCanvas.getContext('2d');
        const { minX, minY, width, height, pad } = computeExportBounds(measureCtx);

        // Adaptive DPR to stay safely within browser canvas limits on giant boards
        const MAX_DIM = 14000;
        const MAX_AREA = 120000000;
        let dpr = Math.min(
          2,
          MAX_DIM / Math.max(1, width),
          MAX_DIM / Math.max(1, height),
          Math.sqrt(MAX_AREA / Math.max(1, width * height))
        );
        dpr = Math.max(0.25, Math.floor(dpr * 100) / 100);

        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(width * dpr));
        canvas.height = Math.max(1, Math.round(height * dpr));
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = '#e2e8f0';
        for (let gx = 12; gx < width; gx += 24) {
          for (let gy = 12; gy < height; gy += 24) {
            ctx.beginPath();
            ctx.arc(gx, gy, 1.1, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.translate(-minX + pad, -minY + pad);

        // 1. Draw nodes first (same z-order as live board)
        state.nodes.forEach(node => {
          const { w, h } = getNodeSize(node);
          const shapeKey = node.shape || 'card';
          const shapeInfo = SHAPE_MAP[shapeKey] || SHAPE_MAP.card;
          const rot = ((node.rotate || 0) % 360 + 360) % 360;
          const swap = rot === 90 || rot === 270;
          const cw = swap ? h : w;
          const ch = swap ? w : h;
          const spec = buildShapeSpec(shapeKey, cw, ch, 1.2);
          const inset = transformInsetForNode(spec.inset, node);

          // Draw transformed shape via Path2D (exact pixel match with SVG)
          ctx.save();
          ctx.translate(node.x + w / 2, node.y + h / 2);
          if (rot) ctx.rotate((rot * Math.PI) / 180);
          ctx.scale(node.flipX ? -1 : 1, node.flipY ? -1 : 1);
          ctx.translate(-cw / 2, -ch / 2);

          ctx.lineWidth = 1.8;
          ctx.lineJoin = 'round';
          ctx.lineCap = 'round';

          spec.fills.forEach((f, idx) => {
            const p2d = new Path2D(f.d);
            ctx.save();
            if (idx === 0) {
              ctx.shadowColor = 'rgba(15, 23, 42, 0.08)';
              ctx.shadowBlur = 8;
              ctx.shadowOffsetY = 2;
            }
            ctx.fillStyle = node.bgColor;
            if (shapeKey === 'comment' && node.bgColor.toLowerCase() === '#ffffff') {
              ctx.globalAlpha = 0.72;
            }
            ctx.fill(p2d);
            ctx.restore();
            if (f.stroke !== false) {
              ctx.lineJoin = f.lineJoin || 'round';
              ctx.strokeStyle = node.borderColor;
              ctx.stroke(p2d);
            }
          });

          spec.strokes.forEach(s => {
            const p2d = new Path2D(s.d);
            ctx.save();
            ctx.strokeStyle = node.borderColor;
            if (s.dashed) ctx.setLineDash([5, 4]);
            ctx.stroke(p2d);
            ctx.restore();
          });
          ctx.restore();

          // Draw upright text inside transformed shape inset (with long-word breaking)
          ctx.save();
          ctx.fillStyle = node.textColor;
          const fs = node.fontSize || 14;
          ctx.font = `${fs}px ${EXPORT_FONT_FAMILY}`;
          ctx.textBaseline = 'top';
          const lineH = Math.round(fs * 1.42);
          const maxW = Math.max(20, w - inset.left - inset.right);
          const lines = wrapTextLines(ctx, node.text || '', maxW);

          const totalTextH = lines.length * lineH;
          const availH = Math.max(lineH, h - inset.top - inset.bottom);
          const startY = shapeInfo.align === 'center'
            ? node.y + inset.top + Math.max(0, (availH - totalTextH) / 2)
            : node.y + inset.top;
          const textX = shapeInfo.align === 'center'
            ? node.x + inset.left + maxW / 2
            : node.x + inset.left;
          ctx.textAlign = shapeInfo.align === 'center' ? 'center' : 'left';

          lines.forEach((ln, i) => {
            if (ln) ctx.fillText(ln, textX, startY + i * lineH);
          });
          ctx.restore();
        });

        // 2. Draw edges on top
        state.edges.forEach(edge => {
          const geom = buildEdgeGeometry(edge);
          const color = edge.color || '#64748b';
          const sw = edge.width || 2.5;
          const lineStyle = edge.lineStyle || (edge.dashed ? 'dashed' : 'solid');
          const startHead = edge.startHead || (edge.arrowStart ? 'triangle' : 'none');
          const endHead = edge.endHead || (edge.arrowEnd ? 'triangle' : 'none');
          const headColors = getEdgeHeadColors(edge);

          const traceEdgePath = () => {
            ctx.beginPath();
            ctx.moveTo(geom.pts[0].x, geom.pts[0].y);
            geom.segments.forEach(seg => {
              if (seg.type === 'cubic') {
                ctx.bezierCurveTo(seg.cp1.x, seg.cp1.y, seg.cp2.x, seg.cp2.y, seg.p1.x, seg.p1.y);
              } else {
                ctx.lineTo(seg.p1.x, seg.p1.y);
              }
            });
          };

          ctx.save();
          ctx.lineJoin = 'round';
          if (lineStyle === 'double') {
            traceEdgePath();
            ctx.strokeStyle = color;
            ctx.lineWidth = sw * 2.35;
            ctx.lineCap = 'butt';
            ctx.stroke();

            traceEdgePath();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(1.4, sw * 0.95);
            ctx.lineCap = 'butt';
            ctx.stroke();
          } else {
            traceEdgePath();
            ctx.strokeStyle = color;
            ctx.lineWidth = sw;
            ctx.lineCap = 'round';
            if (lineStyle === 'dashed') {
              ctx.setLineDash([Math.max(6, sw * 3.2), Math.max(5, sw * 2.4)]);
            } else if (lineStyle === 'dotted') {
              ctx.setLineDash([0.4, Math.max(5, sw * 2.3)]);
            }
            ctx.stroke();
            ctx.setLineDash([]);
          }

          const drawHead = (tip, fromPt, headType) => {
            if (!headType || headType === 'none') return;
            const angle = Math.atan2(tip.y - fromPt.y, tip.x - fromPt.x);
            const s = Math.max(10, sw * 4.3);

            ctx.save();
            ctx.translate(tip.x, tip.y);
            ctx.rotate(angle);
            ctx.lineJoin = 'round';

            if (headType === 'triangle') {
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.lineTo(-s, -s * 0.5);
              ctx.lineTo(-s, s * 0.5);
              ctx.closePath();
              ctx.fillStyle = headColors.fill;
              ctx.fill();
              if (headColors.outline) {
                ctx.strokeStyle = headColors.outline;
                ctx.lineWidth = Math.max(1, sw * 0.42);
                ctx.stroke();
              }
            } else if (headType === 'hollow-triangle') {
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.lineTo(-s, -s * 0.5);
              ctx.lineTo(-s, s * 0.5);
              ctx.closePath();
              ctx.fillStyle = '#ffffff';
              ctx.fill();
              ctx.strokeStyle = headColors.hollowStroke;
              ctx.lineWidth = Math.max(1.6, sw * 0.72);
              ctx.stroke();
            } else if (headType === 'diamond') {
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.lineTo(-s * 0.62, -s * 0.44);
              ctx.lineTo(-s * 1.24, 0);
              ctx.lineTo(-s * 0.62, s * 0.44);
              ctx.closePath();
              ctx.fillStyle = headColors.fill;
              ctx.fill();
              if (headColors.outline) {
                ctx.strokeStyle = headColors.outline;
                ctx.lineWidth = Math.max(1, sw * 0.42);
                ctx.stroke();
              }
            } else if (headType === 'circle') {
              const r = s * 0.42;
              ctx.beginPath();
              ctx.arc(-r, 0, r, 0, Math.PI * 2);
              ctx.fillStyle = headColors.fill;
              ctx.fill();
              if (headColors.outline) {
                ctx.strokeStyle = headColors.outline;
                ctx.lineWidth = Math.max(1, sw * 0.42);
                ctx.stroke();
              }
            }
            ctx.restore();
          };

          if (endHead !== 'none' && geom.segments.length > 0) {
            const last = geom.segments[geom.segments.length - 1];
            const ref = last.type === 'cubic' ? last.cp2 : last.p0;
            drawHead(last.p1, ref, endHead);
          }
          if (startHead !== 'none' && geom.segments.length > 0) {
            const first = geom.segments[0];
            const ref = first.type === 'cubic' ? first.cp1 : first.p1;
            drawHead(first.p0, ref, startHead);
          }

          if (edge.label && edge.label.trim()) {
            ctx.font = `500 12px ${EXPORT_FONT_FAMILY}`;
            const tw = ctx.measureText(edge.label).width;
            const lw = tw + 18, lh = 22;
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            roundRect(ctx, geom.midX - lw / 2, geom.midY - lh / 2, lw, lh, 11);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(edge.label, geom.midX, geom.midY + 0.5);
          }
          ctx.restore();
        });

        const filename = `plan-${new Date().toISOString().slice(0, 10)}.png`;
        const toastMsg = dpr < 1.99
          ? `PNG сохранён (автомасштаб ${Math.round(dpr * 50)}% для большой схемы)`
          : 'Картинка PNG сохранена';

        if (canvas.toBlob) {
          canvas.toBlob((blob) => {
            if (!blob) {
              showToast('Не удалось сформировать PNG — попробуйте SVG');
              return;
            }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast(toastMsg);
          }, 'image/png');
        } else {
          const url = canvas.toDataURL('image/png');
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          a.click();
          showToast(toastMsg);
        }
      });

      // --- Vector SVG Export (infinitely sharp at any zoom) ---
      btnSvg.addEventListener('click', () => {
        finishEditing();
        closeRgbPopover(true);
        if (state.nodes.length === 0 && state.edges.length === 0) {
          showToast('На доске пока пусто');
          return;
        }

        const measureCanvas = document.createElement('canvas');
        const measureCtx = measureCanvas.getContext('2d');
        const { minX, minY, width, height, pad } = computeExportBounds(measureCtx);
        const offsetX = -minX + pad;
        const offsetY = -minY + pad;

        const r2 = (n) => Math.round(n * 100) / 100;
        const svgParts = [];
        svgParts.push(`<?xml version="1.0" encoding="UTF-8"?>`);
        svgParts.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`);
        svgParts.push(`  <defs>`);
        svgParts.push(`    <pattern id="bg-dots" width="24" height="24" patternUnits="userSpaceOnUse">`);
        svgParts.push(`      <circle cx="12" cy="12" r="1.15" fill="#e2e8f0"/>`);
        svgParts.push(`    </pattern>`);
        svgParts.push(`    <filter id="node-shadow" x="-15%" y="-15%" width="130%" height="140%">`);
        svgParts.push(`      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.08"/>`);
        svgParts.push(`    </filter>`);
        svgParts.push(`  </defs>`);
        svgParts.push(`  <rect width="100%" height="100%" fill="#ffffff"/>`);
        svgParts.push(`  <rect width="100%" height="100%" fill="url(#bg-dots)"/>`);
        svgParts.push(`  <g transform="translate(${r2(offsetX)} ${r2(offsetY)})" font-family="${escapeXml(EXPORT_FONT_FAMILY)}">`);

        // 1. Vector Nodes
        svgParts.push(`    <g id="nodes">`);
        state.nodes.forEach(node => {
          const { w, h } = getNodeSize(node);
          const shapeKey = node.shape || 'card';
          const shapeInfo = SHAPE_MAP[shapeKey] || SHAPE_MAP.card;
          const rot = ((node.rotate || 0) % 360 + 360) % 360;
          const swap = rot === 90 || rot === 270;
          const cw = swap ? h : w;
          const ch = swap ? w : h;
          const spec = buildShapeSpec(shapeKey, cw, ch, 1.2);
          const inset = transformInsetForNode(spec.inset, node);

          const sx = node.flipX ? -1 : 1;
          const sy = node.flipY ? -1 : 1;
          const tf = `translate(${r2(node.x + w / 2)} ${r2(node.y + h / 2)}) rotate(${rot}) scale(${sx} ${sy}) translate(${r2(-cw / 2)} ${r2(-ch / 2)})`;

          svgParts.push(`      <g>`);
          svgParts.push(`        <g transform="${tf}" filter="url(#node-shadow)">`);
          spec.fills.forEach(f => {
            const join = f.lineJoin || 'round';
            const fillOp = shapeKey === 'comment' && node.bgColor.toLowerCase() === '#ffffff' ? ' fill-opacity="0.72"' : '';
            const strokeAttr = f.stroke === false
              ? 'stroke="none"'
              : `stroke="${escapeXml(node.borderColor)}" stroke-width="1.8" stroke-linejoin="${join}"`;
            svgParts.push(`          <path d="${f.d}" fill="${escapeXml(node.bgColor)}"${fillOp} ${strokeAttr}/>`);
          });
          spec.strokes.forEach(s => {
            const dashAttr = s.dashed ? ' stroke-dasharray="5 4"' : '';
            svgParts.push(`          <path d="${s.d}" fill="none" stroke="${escapeXml(node.borderColor)}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"${dashAttr}/>`);
          });
          svgParts.push(`        </g>`);

          // Upright wrapped text
          const fs = node.fontSize || 14;
          measureCtx.font = `${fs}px ${EXPORT_FONT_FAMILY}`;
          const lineH = Math.round(fs * 1.42);
          const maxW = Math.max(20, w - inset.left - inset.right);
          const lines = wrapTextLines(measureCtx, node.text || '', maxW);
          const totalTextH = lines.length * lineH;
          const availH = Math.max(lineH, h - inset.top - inset.bottom);
          const startY = shapeInfo.align === 'center'
            ? node.y + inset.top + Math.max(0, (availH - totalTextH) / 2)
            : node.y + inset.top;
          const isCenter = shapeInfo.align === 'center';
          const textX = isCenter ? node.x + inset.left + maxW / 2 : node.x + inset.left;
          const anchor = isCenter ? 'middle' : 'start';

          if (lines.some(ln => ln !== '')) {
            svgParts.push(`        <text fill="${escapeXml(node.textColor)}" font-size="${fs}" text-anchor="${anchor}">`);
            lines.forEach((ln, idx) => {
              if (!ln) return;
              const ly = startY + idx * lineH + fs * 0.88;
              svgParts.push(`          <tspan x="${r2(textX)}" y="${r2(ly)}">${escapeXml(ln)}</tspan>`);
            });
            svgParts.push(`        </text>`);
          }
          svgParts.push(`      </g>`);
        });
        svgParts.push(`    </g>`);

        // 2. Vector Edges (explicit arrowheads for universal compatibility in Figma/Word/Inkscape/browsers)
        const buildSvgHead = (tip, fromPt, headType, sw, headColors) => {
          if (!headType || headType === 'none') return '';
          const deg = (Math.atan2(tip.y - fromPt.y, tip.x - fromPt.x) * 180) / Math.PI;
          const s = Math.max(10, sw * 4.3);
          const tf = `translate(${r2(tip.x)} ${r2(tip.y)}) rotate(${r2(deg)})`;
          const outAttr = headColors.outline
            ? ` stroke="${escapeXml(headColors.outline)}" stroke-width="${r2(Math.max(1, sw * 0.42))}" stroke-linejoin="round"`
            : '';

          if (headType === 'triangle') {
            return `        <polygon points="0,0 ${r2(-s)},${r2(-s * 0.5)} ${r2(-s)},${r2(s * 0.5)}" fill="${escapeXml(headColors.fill)}"${outAttr} transform="${tf}"/>`;
          }
          if (headType === 'hollow-triangle') {
            return `        <polygon points="0,0 ${r2(-s)},${r2(-s * 0.5)} ${r2(-s)},${r2(s * 0.5)}" fill="#ffffff" stroke="${escapeXml(headColors.hollowStroke)}" stroke-width="${r2(Math.max(1.6, sw * 0.72))}" stroke-linejoin="round" transform="${tf}"/>`;
          }
          if (headType === 'diamond') {
            return `        <polygon points="0,0 ${r2(-s * 0.62)},${r2(-s * 0.44)} ${r2(-s * 1.24)},0 ${r2(-s * 0.62)},${r2(s * 0.44)}" fill="${escapeXml(headColors.fill)}"${outAttr} transform="${tf}"/>`;
          }
          if (headType === 'circle') {
            const rad = s * 0.42;
            return `        <circle cx="${r2(-rad)}" cy="0" r="${r2(rad)}" fill="${escapeXml(headColors.fill)}"${outAttr} transform="${tf}"/>`;
          }
          return '';
        };

        svgParts.push(`    <g id="edges">`);
        state.edges.forEach(edge => {
          const geom = buildEdgeGeometry(edge);
          const color = edge.color || '#64748b';
          const sw = edge.width || 2.5;
          const lineStyle = edge.lineStyle || (edge.dashed ? 'dashed' : 'solid');
          const startHead = edge.startHead || (edge.arrowStart ? 'triangle' : 'none');
          const endHead = edge.endHead || (edge.arrowEnd ? 'triangle' : 'none');
          const headColors = getEdgeHeadColors(edge);

          svgParts.push(`      <g>`);
          if (lineStyle === 'double') {
            svgParts.push(`        <path d="${geom.d}" fill="none" stroke="${escapeXml(color)}" stroke-width="${r2(sw * 2.35)}" stroke-linecap="butt" stroke-linejoin="round"/>`);
            svgParts.push(`        <path d="${geom.d}" fill="none" stroke="#ffffff" stroke-width="${r2(Math.max(1.4, sw * 0.95))}" stroke-linecap="butt" stroke-linejoin="round"/>`);
          } else {
            let dashAttr = '';
            if (lineStyle === 'dashed') {
              dashAttr = ` stroke-dasharray="${r2(Math.max(6, sw * 3.2))} ${r2(Math.max(5, sw * 2.4))}"`;
            } else if (lineStyle === 'dotted') {
              dashAttr = ` stroke-dasharray="0.2 ${r2(Math.max(5, sw * 2.3))}"`;
            }
            svgParts.push(`        <path d="${geom.d}" fill="none" stroke="${escapeXml(color)}" stroke-width="${r2(sw)}" stroke-linecap="round" stroke-linejoin="round"${dashAttr}/>`);
          }

          if (endHead !== 'none' && geom.segments.length > 0) {
            const last = geom.segments[geom.segments.length - 1];
            const ref = last.type === 'cubic' ? last.cp2 : last.p0;
            svgParts.push(buildSvgHead(last.p1, ref, endHead, sw, headColors));
          }
          if (startHead !== 'none' && geom.segments.length > 0) {
            const first = geom.segments[0];
            const ref = first.type === 'cubic' ? first.cp1 : first.p1;
            svgParts.push(buildSvgHead(first.p0, ref, startHead, sw, headColors));
          }

          if (edge.label && edge.label.trim()) {
            measureCtx.font = `500 12px ${EXPORT_FONT_FAMILY}`;
            const tw = measureCtx.measureText(edge.label).width;
            const lw = tw + 18, lh = 22;
            svgParts.push(`        <rect x="${r2(geom.midX - lw / 2)}" y="${r2(geom.midY - lh / 2)}" width="${r2(lw)}" height="${lh}" rx="11" ry="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>`);
            svgParts.push(`        <text x="${r2(geom.midX)}" y="${r2(geom.midY + 4)}" fill="${escapeXml(color)}" font-size="12" font-weight="500" text-anchor="middle">${escapeXml(edge.label)}</text>`);
          }
          svgParts.push(`      </g>`);
        });
        svgParts.push(`    </g>`);
        svgParts.push(`  </g>`);
        svgParts.push(`</svg>`);

        const svgBlob = new Blob([svgParts.join('\n')], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `plan-${new Date().toISOString().slice(0, 10)}.svg`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast('Векторный SVG сохранён');
      });

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      // --- Keyboard Shortcuts ---
      window.addEventListener('keydown', (e) => {
        const isTyping = editingNodeId !== null ||
          (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA' || document.activeElement.isContentEditable));

        if (e.key === 'Escape') {
          if (nodeShapePopover.classList.contains('visible')) {
            closeNodeShapePopover();
          } else if (edgeStylePopover.classList.contains('visible')) {
            closeEdgeStylePopover();
          } else if (rgbPopover.classList.contains('visible')) {
            closeRgbPopover(true);
          } else if (editingNodeId) {
            finishEditing();
          } else if (connectMode) {
            setConnectMode(false);
          } else {
            clearSelection();
          }
          return;
        }

        if (isTyping) {
          if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && editingNodeId) {
            e.preventDefault();
            finishEditing();
          }
          return;
        }

        const mod = e.ctrlKey || e.metaKey;
        const keyLow = e.key.toLowerCase();

        if (e.key === 'Delete' || e.key === 'Backspace') {
          if (selectedNodeIds.size > 0 || selectedEdgeId) {
            e.preventDefault();
            deleteSelected();
          }
        } else if (mod && (e.code === 'KeyC' || keyLow === 'c' || keyLow === 'с')) {
          if (selectedNodeIds.size > 0) {
            e.preventDefault();
            copySelectedNodes();
          }
        } else if (mod && (e.code === 'KeyV' || keyLow === 'v' || keyLow === 'м')) {
          if (clipboard && clipboard.nodes.length > 0) {
            e.preventDefault();
            pasteClipboard();
          }
        } else if (mod && (e.code === 'KeyZ' || keyLow === 'z' || keyLow === 'я')) {
          e.preventDefault();
          if (e.shiftKey) redo();
          else undo();
        } else if (mod && (e.code === 'KeyY' || keyLow === 'y' || keyLow === 'н')) {
          e.preventDefault();
          redo();
        } else if (mod && (e.code === 'KeyD' || keyLow === 'd' || keyLow === 'в')) {
          if (selectedNodeIds.size > 0) {
            e.preventDefault();
            duplicateSelectedNodes();
          }
        } else if (mod && (e.code === 'KeyA' || keyLow === 'a' || keyLow === 'ф')) {
          e.preventDefault();
          selectedNodeIds = new Set(state.nodes.map(n => n.id));
          selectedEdgeId = null;
          syncSelectionVisuals();
          renderEdges();
          updateContextBars();
        }
      });

      // --- Initialization ---
      function init() {
        let loaded = false;
        try {
          const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.state && Array.isArray(parsed.state.nodes)) {
              state = normalizeState(parsed.state);
              if (parsed.view) view = parsed.view;
              if (parsed.settings && typeof parsed.settings === 'object') {
                normalizeSettings(parsed.settings);
              }
              loaded = true;
            }
          }
        } catch (e) {}

        if (!loaded) {
          state = normalizeState({
            nodes: [
              { id: 'n_start', x: 110, y: 176, w: 210, h: 64, shape: 'terminator', text: 'Начало\n(Терминатор ГОСТ)', bgColor: '#dbeafe', borderColor: '#60a5fa', textColor: '#1e3a8a', fontSize: 14 },
              { id: 'n_step1', x: 410, y: 156, w: 210, h: 104, shape: 'decision', text: 'Условие\nвыполнено?', bgColor: '#fef9c3', borderColor: '#eab308', textColor: '#713f12', fontSize: 14 },
              { id: 'n_step2', x: 710, y: 80,  w: 210, h: 72, shape: 'process', text: 'Процесс\nОбработка данных', bgColor: '#dcfce7', borderColor: '#4ade80', textColor: '#14532d', fontSize: 14 },
              { id: 'n_done',  x: 710, y: 245, w: 210, h: 86, shape: 'database', text: 'База данных\nСохранение', bgColor: '#f3e8ff', borderColor: '#c084fc', textColor: '#581c87', fontSize: 14 }
            ],
            edges: [
              { id: 'e_1', from: { nodeId: 'n_start', side: 'right', t: 0.3 }, to: { nodeId: 'n_step1', side: 'left', t: 0.5 }, points: [], color: '#3b82f6', width: 2.5, curveType: 'smooth', label: 'путь А' },
              { id: 'e_2', from: { nodeId: 'n_start', side: 'right', t: 0.7 }, to: { nodeId: 'n_step2', side: 'left', t: 0.5 }, points: [], color: '#22c55e', width: 2.5, curveType: 'smooth', label: 'путь Б' },
              { id: 'e_3', from: { nodeId: 'n_step1', side: 'right', t: 0.5 }, to: { nodeId: 'n_done',  side: 'left', t: 0.3 }, points: [{ x: 745, y: 120 }], color: '#f59e0b', width: 2.5, curveType: 'smooth', label: '' },
              { id: 'e_4', from: { nodeId: 'n_step2', side: 'right', t: 0.5 }, to: { nodeId: 'n_done',  side: 'left', t: 0.7 }, points: [], color: '#a855f7', width: 2.5, dashed: true, curveType: 'smooth', label: '' }
            ]
          });
        }

        syncHeadSourceToggleUI();
        syncToolbarDefaultsUI();
        renderAll();
        pushHistory();
        if (!loaded) {
          requestAnimationFrame(fitToScreen);
        } else {
          updateTransform();
        }
      }

      window.addEventListener('resize', () => {
        closeRgbPopover(true);
        updateContextBars();
      });

      init();
    })();
  </script>
</body>
