          nodeId: node.id,
          side: st.side,
          t: st.t,
          u: best.u,
          x: best.x,
          y: best.y,
          nx: best.nx,
          ny: best.ny,
          dist: best.dist
        };
      }

      function findSnapNodePerimeter(wx, wy, marginWorld = 18) {
        // Check topmost node first against exact transformed contour
        for (let i = state.nodes.length - 1; i >= 0; i--) {
          const node = state.nodes[i];
          const { w, h } = getNodeSize(node);
          if (
            wx >= node.x - marginWorld &&
            wx <= node.x + w + marginWorld &&
            wy >= node.y - marginWorld &&
            wy <= node.y + h + marginWorld
          ) {
            const closest = closestPointOnNodePerimeter(node, wx, wy);
            const wc = getNodeWorldContour(node);
            if (closest.dist <= marginWorld || pointInPolygon(wx, wy, wc.pts)) {
              return closest;
            }
          }
        }
        return null;
      }

      function resolveAutoSides(fromNode, toNode) {
        const fSize = getNodeSize(fromNode);
        const tSize = getNodeSize(toNode);
        const dx = (toNode.x + tSize.w / 2) - (fromNode.x + fSize.w / 2);
        const dy = (toNode.y + tSize.h / 2) - (fromNode.y + fSize.h / 2);
        if (Math.abs(dx) * (fSize.h + tSize.h) >= Math.abs(dy) * (fSize.w + tSize.w)) {
          return dx >= 0 ? { fromSide: 'right', toSide: 'left' } : { fromSide: 'left', toSide: 'right' };
        } else {
          return dy >= 0 ? { fromSide: 'bottom', toSide: 'top' } : { fromSide: 'top', toSide: 'bottom' };
        }
      }

      function resolveEndpoint(endObj, otherRefPt) {
        if (!endObj.nodeId) {
          return { x: endObj.x, y: endObj.y, nx: 0, ny: 0 };
        }
        const node = getNode(endObj.nodeId);
        if (!node) return { x: endObj.x || 0, y: endObj.y || 0, nx: 0, ny: 0 };

        if (typeof endObj.u === 'number' && Number.isFinite(endObj.u)) {
          const wc = getNodeWorldContour(node);
          return evalContourAtU(wc, endObj.u);
        }

        if (endObj.side && endObj.side !== 'auto') {
          return getPerimeterPoint(node, endObj.side, endObj.t ?? 0.5);
        }
        // Auto side toward otherRefPt
        const { w, h } = getNodeSize(node);
        const cx = node.x + w / 2;
        const cy = node.y + h / 2;
        const dx = otherRefPt.x - cx;
        const dy = otherRefPt.y - cy;
        let side = 'right';
        if (Math.abs(dx) * h >= Math.abs(dy) * w) {
          side = dx >= 0 ? 'right' : 'left';
        } else {
          side = dy >= 0 ? 'bottom' : 'top';
        }
        return getPerimeterPoint(node, side, endObj.t ?? 0.5);
      }

      function getEdgeEndpoints(edge) {
        // Rough reference points first for auto-side resolution
        const roughRef = (endObj) => {
          if (!endObj.nodeId) return { x: endObj.x, y: endObj.y };
          const n = getNode(endObj.nodeId);
          if (!n) return { x: 0, y: 0 };
          const { w, h } = getNodeSize(n);
          return { x: n.x + w / 2, y: n.y + h / 2 };
        };

        const firstTarget = edge.points.length > 0 ? edge.points[0] : roughRef(edge.to);
        const lastTarget = edge.points.length > 0 ? edge.points[edge.points.length - 1] : roughRef(edge.from);

        const start = resolveEndpoint(edge.from, firstTarget);
        const end = resolveEndpoint(edge.to, lastTarget);
        return { start, end };
      }

      // --- Flexible Spline & Polyline Geometry ---
      function evalCubic(p0, cp1, cp2, p3, t) {
        const mt = 1 - t;
        const mt2 = mt * mt;
        const t2 = t * t;
        return {
          x: mt2 * mt * p0.x + 3 * mt2 * t * cp1.x + 3 * mt * t2 * cp2.x + t2 * t * p3.x,
          y: mt2 * mt * p0.y + 3 * mt2 * t * cp1.y + 3 * mt * t2 * cp2.y + t2 * t * p3.y
        };
      }

      function buildEdgeGeometry(edge) {
        const { start, end } = getEdgeEndpoints(edge);
        const pts = [start, ...edge.points, end];
        const segments = []; // each: { type: 'line'|'cubic', p0, cp1, cp2, p1 }

        if (edge.curveType === 'straight') {
          let d = `M ${pts[0].x} ${pts[0].y}`;
          for (let i = 0; i < pts.length - 1; i++) {
            d += ` L ${pts[i + 1].x} ${pts[i + 1].y}`;
            segments.push({ type: 'line', p0: pts[i], p1: pts[i + 1], spanIndex: i });
          }
          const mid = getPolylineMidpoint(pts);
          return { d, start, end, pts, segments, midX: mid.x, midY: mid.y };
        }

        if (edge.curveType === 'orthogonal') {
          return buildOrthogonalGeometry(start, end, edge.points);
        }

        // Smooth flexible curve
        if (pts.length === 2) {
          const dist = Math.hypot(end.x - start.x, end.y - start.y);
          const offset = Math.min(130, Math.max(32, dist * 0.36));

          let cp1, cp2;
          if (start.nx || start.ny) {
            cp1 = { x: start.x + start.nx * offset, y: start.y + start.ny * offset };
          } else {
            cp1 = { x: start.x + (end.x - start.x) * 0.33, y: start.y + (end.y - start.y) * 0.33 };
          }
          if (end.nx || end.ny) {
            cp2 = { x: end.x + end.nx * offset, y: end.y + end.ny * offset };
          } else {
            cp2 = { x: end.x - (end.x - start.x) * 0.33, y: end.y - (end.y - start.y) * 0.33 };
          }

          const d = `M ${start.x} ${start.y} C ${cp1.x} ${cp1.y}, ${cp2.x} ${cp2.y}, ${end.x} ${end.y}`;
          segments.push({ type: 'cubic', p0: start, cp1, cp2, p1: end });
          const mid = evalCubic(start, cp1, cp2, end, 0.5);
          return { d, start, end, pts, segments, midX: mid.x, midY: mid.y };
        }

        // Smooth multi-point spline (non-looping tangent Catmull-Rom)
        const n = pts.length;
        const tangents = [];

        for (let i = 0; i < n; i++) {
          if (i === 0) {
            const dx = pts[1].x - pts[0].x;
            const dy = pts[1].y - pts[0].y;
            const len = Math.hypot(dx, dy) || 1;
            let tx = dx / len, ty = dy / len;
            // Gently blend with outward block normal only if pointing mostly outward
            if ((start.nx || start.ny) && (tx * start.nx + ty * start.ny) > -0.1) {
              tx = tx * 0.65 + start.nx * 0.35;
              ty = ty * 0.65 + start.ny * 0.35;
              const nl = Math.hypot(tx, ty) || 1;
              tx /= nl; ty /= nl;
            }
            tangents.push({ x: tx, y: ty });
          } else if (i === n - 1) {
            const dx = pts[n - 1].x - pts[n - 2].x;
            const dy = pts[n - 1].y - pts[n - 2].y;
            const len = Math.hypot(dx, dy) || 1;
            let tx = dx / len, ty = dy / len;
            // Gently blend with inward normal (-end.n) if coming from outside
            if ((end.nx || end.ny) && (tx * (-end.nx) + ty * (-end.ny)) > -0.1) {
              tx = tx * 0.65 + (-end.nx) * 0.35;
              ty = ty * 0.65 + (-end.ny) * 0.35;
              const nl = Math.hypot(tx, ty) || 1;
              tx /= nl; ty /= nl;
            }
            tangents.push({ x: tx, y: ty });
          } else {
            const v1x = pts[i].x - pts[i - 1].x;
            const v1y = pts[i].y - pts[i - 1].y;
            const l1 = Math.hypot(v1x, v1y) || 1;
            const v2x = pts[i + 1].x - pts[i].x;
            const v2y = pts[i + 1].y - pts[i].y;
            const l2 = Math.hypot(v2x, v2y) || 1;
            // Average unit directions for smooth, cusp-free, loop-free tangent
            let tx = (v1x / l1) + (v2x / l2);
            let ty = (v1y / l1) + (v2y / l2);
            const tl = Math.hypot(tx, ty);
            if (tl < 1e-4) {
              tx = -v1y / l1;
              ty = v1x / l1;
            } else {
              tx /= tl;
              ty /= tl;
            }
            tangents.push({ x: tx, y: ty });
          }
        }

        let d = `M ${pts[0].x} ${pts[0].y}`;
        for (let i = 0; i < n - 1; i++) {
          const p0 = pts[i];
          const p1 = pts[i + 1];
          const segLen = Math.hypot(p1.x - p0.x, p1.y - p0.y);
          const handleLen = segLen * 0.33;
          const cp1 = { x: p0.x + tangents[i].x * handleLen, y: p0.y + tangents[i].y * handleLen };
          const cp2 = { x: p1.x - tangents[i + 1].x * handleLen, y: p1.y - tangents[i + 1].y * handleLen };
          d += ` C ${cp1.x} ${cp1.y}, ${cp2.x} ${cp2.y}, ${p1.x} ${p1.y}`;
          segments.push({ type: 'cubic', p0, cp1, cp2, p1 });
        }

        const mid = getSegmentsMidpoint(segments);
        return { d, start, end, pts, segments, midX: mid.x, midY: mid.y };
      }

      function getPolylineMidpoint(pts) {
        let total = 0;
        const lens = [];
        for (let i = 0; i < pts.length - 1; i++) {
          const l = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
          lens.push(l);
          total += l;
        }
        let half = total / 2;
        for (let i = 0; i < lens.length; i++) {
          if (half <= lens[i] || i === lens.length - 1) {
            const frac = lens[i] > 0 ? half / lens[i] : 0.5;
            return {
              x: pts[i].x + (pts[i + 1].x - pts[i].x) * frac,
              y: pts[i].y + (pts[i + 1].y - pts[i].y) * frac
            };
          }
          half -= lens[i];
        }
        return pts[0];
      }

      function getSegmentsMidpoint(segments) {
        const samples = [];
        let total = 0;
        for (const seg of segments) {
          const steps = seg.type === 'cubic' ? 12 : 1;
          let prev = seg.p0;
          for (let s = 1; s <= steps; s++) {
            const t = s / steps;
            const cur = seg.type === 'cubic' ? evalCubic(seg.p0, seg.cp1, seg.cp2, seg.p1, t) : seg.p1;
            const len = Math.hypot(cur.x - prev.x, cur.y - prev.y);
            samples.push({ a: prev, b: cur, len });
            total += len;
            prev = cur;
          }
        }
        let half = total / 2;
        for (const sp of samples) {
          if (half <= sp.len) {
            const f = sp.len > 0 ? half / sp.len : 0.5;
            return { x: sp.a.x + (sp.b.x - sp.a.x) * f, y: sp.a.y + (sp.b.y - sp.a.y) * f };
          }
          half -= sp.len;
        }
        return segments[0].p0;
      }

      function simplifyOrthoPoints(rawPts) {
        const clean = [];
        for (const p of rawPts) {
          if (clean.length === 0) {
            clean.push({ x: p.x, y: p.y, spanIndex: p.spanIndex });
            continue;
          }
          const last = clean[clean.length - 1];
          if (Math.hypot(p.x - last.x, p.y - last.y) < 0.5) continue;
          clean.push({ x: p.x, y: p.y, spanIndex: p.spanIndex });
        }
        // Remove collinear middle points while keeping endpoints
        const out = [];
        for (let i = 0; i < clean.length; i++) {
          if (out.length >= 2) {
            const a = out[out.length - 2];
            const b = out[out.length - 1];
            const c = clean[i];
            const sameX = Math.abs(a.x - b.x) < 0.5 && Math.abs(b.x - c.x) < 0.5;
            const sameY = Math.abs(a.y - b.y) < 0.5 && Math.abs(b.y - c.y) < 0.5;
            if ((sameX || sameY) && b.spanIndex === c.spanIndex) {
              out[out.length - 1] = c;
              continue;
            }
          }
          out.push(clean[i]);
        }
        return out.length >= 2 ? out : rawPts;
      }

      function buildOrthogonalGeometry(start, end, waypoints) {
        const distSE = Math.hypot(end.x - start.x, end.y - start.y);
        const stub = Math.min(24, Math.max(10, distSE * 0.25));
        const raw = [];
        const pushPt = (x, y, spanIndex) => raw.push({ x, y, spanIndex });

        pushPt(start.x, start.y, 0);

        const sHasDir = !!(start.nx || start.ny);
        const eHasDir = !!(end.nx || end.ny);
        const sDir = sHasDir
          ? (Math.abs(start.nx) >= Math.abs(start.ny) ? 'H' : 'V')
          : (Math.abs(end.x - start.x) >= Math.abs(end.y - start.y) ? 'H' : 'V');
        const eDir = eHasDir
          ? (Math.abs(end.nx) >= Math.abs(end.ny) ? 'H' : 'V')
          : sDir;
        const sAx = sHasDir ? (sDir === 'H' ? Math.sign(start.nx || 1) : 0) : 0;
        const sAy = sHasDir ? (sDir === 'V' ? Math.sign(start.ny || 1) : 0) : 0;
        const eAx = eHasDir ? (eDir === 'H' ? Math.sign(end.nx || 1) : 0) : 0;
        const eAy = eHasDir ? (eDir === 'V' ? Math.sign(end.ny || 1) : 0) : 0;

        const s1 = sHasDir ? { x: start.x + sAx * stub, y: start.y + sAy * stub } : { x: start.x, y: start.y };
        const e1 = eHasDir ? { x: end.x + eAx * stub, y: end.y + eAy * stub } : { x: end.x, y: end.y };

        if (!waypoints || waypoints.length === 0) {
          if (sDir === 'H' && eDir === 'H') {
            const facingForward =
              (sAx > 0 && eAx < 0 && s1.x <= e1.x) ||
              (sAx < 0 && eAx > 0 && s1.x >= e1.x) ||
              (!sHasDir && !eHasDir);
            const sameSide = sHasDir && eHasDir && sAx === eAx;

            if (facingForward) {
              const midX = (s1.x + e1.x) / 2;
              pushPt(midX, start.y, 0);
              pushPt(midX, end.y, 0);
            } else if (sameSide) {
              const outerX = sAx > 0 ? Math.max(s1.x, e1.x) : Math.min(s1.x, e1.x);
              pushPt(outerX, start.y, 0);
              pushPt(outerX, end.y, 0);
            } else if (!eHasDir) {
              if (!sHasDir || (end.x - start.x) * sAx >= stub * 0.5) {
                const midX = (start.x + end.x) / 2;
                pushPt(midX, start.y, 0);
                pushPt(midX, end.y, 0);
              } else {
                pushPt(s1.x, start.y, 0);
                pushPt(s1.x, end.y, 0);
              }
            } else if (!sHasDir) {
              if ((start.x - end.x) * eAx >= stub * 0.5) {
                const midX = (start.x + end.x) / 2;
                pushPt(midX, start.y, 0);
                pushPt(midX, end.y, 0);
              } else {
                pushPt(e1.x, start.y, 0);
                pushPt(e1.x, end.y, 0);
              }
            } else {
              // Opposite directions facing away / crossed blocks -> wrap cleanly around
              const midY = Math.abs(start.y - end.y) < 44
                ? Math.min(start.y, end.y) - 56
                : (start.y + end.y) / 2;
              pushPt(s1.x, s1.y, 0);
              pushPt(s1.x, midY, 0);
              pushPt(e1.x, midY, 0);
              pushPt(e1.x, e1.y, 0);
            }
          } else if (sDir === 'V' && eDir === 'V') {
            const facingForward =
              (sAy > 0 && eAy < 0 && s1.y <= e1.y) ||
              (sAy < 0 && eAy > 0 && s1.y >= e1.y) ||
              (!sHasDir && !eHasDir);
            const sameSide = sHasDir && eHasDir && sAy === eAy;

            if (facingForward) {
              const midY = (s1.y + e1.y) / 2;
              pushPt(start.x, midY, 0);
              pushPt(end.x, midY, 0);
            } else if (sameSide) {
              const outerY = sAy > 0 ? Math.max(s1.y, e1.y) : Math.min(s1.y, e1.y);
              pushPt(start.x, outerY, 0);
              pushPt(end.x, outerY, 0);
            } else if (!eHasDir) {
              if (!sHasDir || (end.y - start.y) * sAy >= stub * 0.5) {
                const midY = (start.y + end.y) / 2;
                pushPt(start.x, midY, 0);
                pushPt(end.x, midY, 0);
              } else {
                pushPt(start.x, s1.y, 0);
                pushPt(end.x, s1.y, 0);
              }
            } else if (!sHasDir) {
              if ((start.y - end.y) * eAy >= stub * 0.5) {
                const midY = (start.y + end.y) / 2;
                pushPt(start.x, midY, 0);
                pushPt(end.x, midY, 0);
              } else {
                pushPt(start.x, e1.y, 0);
                pushPt(end.x, e1.y, 0);
              }
            } else {
              const midX = Math.abs(start.x - end.x) < 44
                ? Math.max(start.x, end.x) + 56
                : (start.x + end.x) / 2;
              pushPt(s1.x, s1.y, 0);
              pushPt(midX, s1.y, 0);
              pushPt(midX, e1.y, 0);
              pushPt(e1.x, e1.y, 0);
            }
          } else if (sDir === 'H' && eDir === 'V') {
            const inFrontA = !sHasDir || (end.x - start.x) * sAx >= stub * 0.5;
            const inFrontB = !eHasDir || (start.y - end.y) * eAy >= stub * 0.5;
            if (inFrontA && inFrontB) {
              pushPt(end.x, start.y, 0);
            } else {
              pushPt(s1.x, start.y, 0);
              pushPt(s1.x, e1.y, 0);
              pushPt(end.x, e1.y, 0);
            }
          } else {
            // sDir === 'V' && eDir === 'H'
            const inFrontA = !sHasDir || (end.y - start.y) * sAy >= stub * 0.5;
            const inFrontB = !eHasDir || (start.x - end.x) * eAx >= stub * 0.5;
            if (inFrontA && inFrontB) {
              pushPt(start.x, end.y, 0);
            } else {
              pushPt(start.x, s1.y, 0);
              pushPt(e1.x, s1.y, 0);
              pushPt(e1.x, end.y, 0);
            }
          }
          pushPt(end.x, end.y, 0);
        } else {
          // Route orthogonally through every manual waypoint while respecting exit/entry normals
          const w0 = waypoints[0];
          let prevDir = sDir;

          if (sDir === 'H') {
            const inFront = !sHasDir || (w0.x - start.x) * sAx >= stub * 0.4;
            if (inFront) {
              pushPt(w0.x, start.y, 0);
              prevDir = 'V';
            } else {
              pushPt(s1.x, start.y, 0);
              pushPt(s1.x, w0.y, 0);
              prevDir = 'H';
            }
          } else {
            const inFront = !sHasDir || (w0.y - start.y) * sAy >= stub * 0.4;
            if (inFront) {
              pushPt(start.x, w0.y, 0);
              prevDir = 'H';
            } else {
              pushPt(start.x, s1.y, 0);
              pushPt(w0.x, s1.y, 0);
              prevDir = 'V';
            }
          }
          pushPt(w0.x, w0.y, 0);

          for (let i = 0; i < waypoints.length - 1; i++) {
            const a = waypoints[i];
            const b = waypoints[i + 1];
            const span = i + 1;
            if (prevDir === 'H') {
              pushPt(a.x, b.y, span);
              prevDir = 'H';
            } else {
              pushPt(b.x, a.y, span);
              prevDir = 'V';
            }
            pushPt(b.x, b.y, span);
          }

          const lastW = waypoints[waypoints.length - 1];
          const lastSpan = waypoints.length;
          if (eHasDir) {
            if (eDir === 'H') {
              const inFront = (lastW.x - end.x) * eAx >= stub * 0.4;
              if (inFront) {
                pushPt(lastW.x, end.y, lastSpan);
              } else {
                pushPt(e1.x, lastW.y, lastSpan);
                pushPt(e1.x, end.y, lastSpan);
              }
            } else {
              const inFront = (lastW.y - end.y) * eAy >= stub * 0.4;
              if (inFront) {
                pushPt(end.x, lastW.y, lastSpan);
              } else {
                pushPt(lastW.x, e1.y, lastSpan);
                pushPt(end.x, e1.y, lastSpan);
              }
            }
          } else {
            if (prevDir === 'H') pushPt(lastW.x, end.y, lastSpan);
            else pushPt(end.x, lastW.y, lastSpan);
          }
          pushPt(end.x, end.y, lastSpan);
        }

        const pts = simplifyOrthoPoints(raw);
        let d = `M ${pts[0].x} ${pts[0].y}`;
        const segments = [];
        for (let i = 0; i < pts.length - 1; i++) {
          d += ` L ${pts[i + 1].x} ${pts[i + 1].y}`;
          segments.push({
            type: 'line',
            p0: pts[i],
            p1: pts[i + 1],
            spanIndex: pts[i + 1].spanIndex ?? 0
          });
        }
        const mid = getPolylineMidpoint(pts);
        return { d, start, end, pts, segments, midX: mid.x, midY: mid.y };
      }

      function findClosestSegmentIndex(edge, wx, wy) {
        const geom = buildEdgeGeometry(edge);
        let bestIdx = 0;
        let bestDist = Infinity;

        geom.segments.forEach((seg, idx) => {
          const steps = seg.type === 'cubic' ? 20 : 12;
          for (let s = 0; s <= steps; s++) {
            const t = s / steps;
            const pt = seg.type === 'cubic'
              ? evalCubic(seg.p0, seg.cp1, seg.cp2, seg.p1, t)
              : { x: seg.p0.x + (seg.p1.x - seg.p0.x) * t, y: seg.p0.y + (seg.p1.y - seg.p0.y) * t };
            const d = Math.hypot(wx - pt.x, wy - pt.y);
            if (d < bestDist) {
              bestDist = d;
              bestIdx = idx;
            }
          }
        });
        const bestSeg = geom.segments[bestIdx];
        if (bestSeg && typeof bestSeg.spanIndex === 'number') {
          return clamp(bestSeg.spanIndex, 0, edge.points.length);
        }
        return clamp(bestIdx, 0, edge.points.length);
      }

      // --- Render Nodes ---
      function renderNodeShapeSvg(el, node) {
        const svg = el.querySelector('.node-shape-svg');
        if (!svg) return;
        const w = el.offsetWidth || node.w || 210;
        const h = el.offsetHeight || node.h || 68;
        const rot = ((node.rotate || 0) % 360 + 360) % 360;
        const swap = rot === 90 || rot === 270;
        const cw = swap ? h : w;
        const ch = swap ? w : h;
        const shapeKey = node.shape || 'card';
        const spec = buildShapeSpec(shapeKey, cw, ch, 1.2);

        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
        svg.setAttribute('width', String(w));
        svg.setAttribute('height', String(h));

        const sx = node.flipX ? -1 : 1;
        const sy = node.flipY ? -1 : 1;
        const transformStr = `translate(${w / 2} ${h / 2}) rotate(${rot}) scale(${sx} ${sy}) translate(${-cw / 2} ${-ch / 2})`;

        let inner = `<g transform="${transformStr}">`;
        for (const f of spec.fills) {
          const join = f.lineJoin || 'round';
          const strokeAttr = f.stroke === false ? 'stroke="none"' : `stroke="${node.borderColor}" stroke-width="1.8" stroke-linejoin="${join}"`;
          const fillOp = shapeKey === 'comment' && node.bgColor.toLowerCase() === '#ffffff' ? 'fill-opacity="0.72"' : '';
          inner += `<path d="${f.d}" fill="${node.bgColor}" ${fillOp} ${strokeAttr} />`;
        }
        for (const s of spec.strokes) {
          const dashAttr = s.dashed ? 'stroke-dasharray="5 4"' : '';
          inner += `<path d="${s.d}" fill="none" stroke="${node.borderColor}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${dashAttr} />`;
        }
        inner += '</g>';
        svg.innerHTML = inner;
      }

      function applyNodeStyles(el, node) {
        const shapeKey = node.shape || 'card';
        const shapeInfo = SHAPE_MAP[shapeKey] || SHAPE_MAP.card;
        const rot = ((node.rotate || 0) % 360 + 360) % 360;
        const swap = rot === 90 || rot === 270;

        el.style.left = node.x + 'px';
        el.style.top = node.y + 'px';
        el.style.width = node.w + 'px';
        el.style.minHeight = node.h + 'px';
        el.style.color = node.textColor;

        // First compute inset using current box dimensions
        const estW = node.w || 210;
        const estH = el.offsetHeight || node.h || 68;
        const spec = buildShapeSpec(shapeKey, swap ? estH : estW, swap ? estW : estH, 1.2);
        const inset = transformInsetForNode(spec.inset, node);

        const wrap = el.querySelector('.node-content-wrap');
        if (wrap) {
          wrap.style.padding = `${inset.top}px ${inset.right}px ${inset.bottom}px ${inset.left}px`;
          wrap.style.minHeight = node.h + 'px';
          wrap.style.textAlign = shapeInfo.align;
          wrap.style.alignItems = shapeInfo.align === 'center' ? 'center' : 'flex-start';
        }

        const content = el.querySelector('.node-content');
        if (content) {
          content.style.color = node.textColor;
          content.style.fontSize = node.fontSize + 'px';
          content.style.textAlign = shapeInfo.align;
        }

        renderNodeShapeSvg(el, node);
      }

      function createNodeElement(node) {
        const el = document.createElement('div');
        el.className = 'node';
        el.dataset.id = node.id;

        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'node-shape-svg');
        el.appendChild(svg);

        const wrap = document.createElement('div');
        wrap.className = 'node-content-wrap';

        const content = document.createElement('div');
        content.className = 'node-content';
        content.textContent = node.text || '';
        wrap.appendChild(content);
        el.appendChild(wrap);

        const resize = document.createElement('div');
        resize.className = 'resize-handle';
        resize.title = 'Изменить размер';
        resize.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          if (e.button !== 0) return;
          finishEditing();
          closeRgbPopover(true);
          selectSingleNode(node.id);
          hideMagneticPort();
          const startSize = getNodeSize(node);
          dragState = {
            type: 'resize',
            nodeId: node.id,
            startClientX: e.clientX,
            startClientY: e.clientY,
            startW: startSize.w,
            startH: startSize.h,
            moved: false
          };
        });
        el.appendChild(resize);

        applyNodeStyles(el, node);

        el.addEventListener('pointerdown', (e) => {
          if (e.button !== 0) return;
          if (editingNodeId === node.id) {
            e.stopPropagation();
            return;
          }
          e.stopPropagation();
          finishEditing();
          closeRgbPopover(true);

          if (connectMode) {
            handleConnectModeClick(node.id);
            return;
          }

          if (e.ctrlKey || e.metaKey || e.shiftKey) {
            if (selectedNodeIds.has(node.id)) selectedNodeIds.delete(node.id);
            else selectedNodeIds.add(node.id);
            selectedEdgeId = null;
            syncSelectionVisuals();
            renderEdges();
            updateContextBars();
            return;
          }

          if (!selectedNodeIds.has(node.id)) {
            selectSingleNode(node.id);
          }

          // Prepare multi-node drag
          const moveIds = Array.from(selectedNodeIds);
          const initialPositions = {};
          moveIds.forEach(id => {
            const n = getNode(id);
            if (n) initialPositions[id] = { x: n.x, y: n.y };
          });

          // Collect edges that should move fully with the selected blocks:
          // 1) internal edges (both ends on selected blocks)
          // 2) half-free edges (one end on a selected block, other end free on canvas)
          const movingEdgeData = {};
          state.edges.forEach(edge => {
            const fromIn = !!(edge.from.nodeId && selectedNodeIds.has(edge.from.nodeId));
            const toIn = !!(edge.to.nodeId && selectedNodeIds.has(edge.to.nodeId));
            const fromFree = !edge.from.nodeId;
            const toFree = !edge.to.nodeId;

            if ((fromIn && toIn) || (fromIn && toFree) || (toIn && fromFree)) {
              movingEdgeData[edge.id] = {
                points: edge.points.map(p => ({ x: p.x, y: p.y })),
                moveFreeFrom: fromFree && toIn ? { x: edge.from.x, y: edge.from.y } : null,
                moveFreeTo: toFree && fromIn ? { x: edge.to.x, y: edge.to.y } : null
              };
            }
          });

          dragState = {
            type: 'node',
            moveIds,
            initialPositions,
            movingEdgeData,
            startClientX: e.clientX,
            startClientY: e.clientY,
            moved: false
          };
        });

        el.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          if (connectMode) return;
          startEditingNode(node.id);
        });

        content.addEventListener('input', () => {
          node.text = content.innerText.replace(/\n$/, '');
          renderNodeShapeSvg(el, node);
          renderEdges();
          updateContextBars();
        });

        content.addEventListener('blur', () => {
          if (editingNodeId === node.id) finishEditing();
        });

        return el;
      }

      function renderNodes() {
        nodesLayer.innerHTML = '';
        state.nodes.forEach(node => {
          const el = createNodeElement(node);
          if (selectedNodeIds.has(node.id)) el.classList.add('selected');
          if (node.id === connectSourceId) el.classList.add('connect-source');
          nodesLayer.appendChild(el);
          applyNodeStyles(el, node);
        });
      }

      function syncSelectionVisuals() {
        nodesLayer.querySelectorAll('.node').forEach(el => {
          const id = el.dataset.id;
          const isSel = selectedNodeIds.has(id);
          el.classList.toggle('selected', isSel);
          el.classList.toggle('connect-source', id === connectSourceId);
        });
      }

      // --- Render Edges & Flexible Handles ---
      function getColorLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        return 0.299 * r + 0.587 * g + 0.114 * b;
      }

      function getEdgeHeadColors(edge) {
        const baseColor = edge.color || '#64748b';
        if (settings.headColorFromSource && edge.from && edge.from.nodeId) {
          const srcNode = getNode(edge.from.nodeId);
          if (srcNode) {
            const bg = srcNode.bgColor || '#ffffff';
            const border = srcNode.borderColor || deriveBorderColor(bg);
            const lum = getColorLuminance(bg);
            return {
              fill: bg,
              outline: lum > 195 ? border : null,
              hollowStroke: lum > 205 ? border : bg
            };
          }
        }
        return {
          fill: baseColor,
          outline: null,
          hollowStroke: baseColor
        };
      }

      function createArrowMarker(id, headType, colors, isStart = false) {
        const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
        marker.setAttribute('id', id);
        marker.setAttribute('viewBox', '0 0 14 14');
        marker.setAttribute('refY', '7');
        marker.setAttribute('markerWidth', '7.8');
        marker.setAttribute('markerHeight', '7.8');
        marker.setAttribute('markerUnits', 'strokeWidth');
        marker.setAttribute('orient', 'auto');

        let shape;
        if (headType === 'triangle') {
          marker.setAttribute('refX', isStart ? '2.5' : '11.5');
          shape = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          shape.setAttribute('d', isStart ? 'M 12.5 2 L 1.5 7 L 12.5 12 Z' : 'M 1.5 2 L 12.5 7 L 1.5 12 Z');
          shape.setAttribute('fill', colors.fill);
          shape.setAttribute('fill-opacity', '1');
          if (colors.outline) {
            shape.setAttribute('stroke', colors.outline);
            shape.setAttribute('stroke-width', '0.9');
            shape.setAttribute('stroke-linejoin', 'round');
            shape.setAttribute('stroke-opacity', '1');
          }
        } else if (headType === 'hollow-triangle') {
          marker.setAttribute('refX', isStart ? '2.5' : '11.5');
          shape = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          shape.setAttribute('d', isStart ? 'M 12 2.2 L 1.8 7 L 12 11.8 Z' : 'M 2 2.2 L 12.2 7 L 2 11.8 Z');
          shape.setAttribute('fill', '#ffffff');
          shape.setAttribute('fill-opacity', '1');
          shape.setAttribute('stroke', colors.hollowStroke);
          shape.setAttribute('stroke-width', '1.6');
          shape.setAttribute('stroke-linejoin', 'round');
          shape.setAttribute('stroke-opacity', '1');
        } else if (headType === 'diamond') {
          marker.setAttribute('refX', isStart ? '2.2' : '11.8');
          shape = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          shape.setAttribute('d', 'M 1.4 7 L 7 2.5 L 12.6 7 L 7 11.5 Z');
          shape.setAttribute('fill', colors.fill);
          shape.setAttribute('fill-opacity', '1');
          if (colors.outline) {
            shape.setAttribute('stroke', colors.outline);
            shape.setAttribute('stroke-width', '0.9');
            shape.setAttribute('stroke-linejoin', 'round');
            shape.setAttribute('stroke-opacity', '1');
          }
        } else if (headType === 'circle') {
          marker.setAttribute('refX', isStart ? '3.5' : '10.5');
          shape = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          shape.setAttribute('cx', '7');
          shape.setAttribute('cy', '7');
          shape.setAttribute('r', '4.1');
          shape.setAttribute('fill', colors.fill);
          shape.setAttribute('fill-opacity', '1');
          if (colors.outline) {
            shape.setAttribute('stroke', colors.outline);
            shape.setAttribute('stroke-width', '0.9');
            shape.setAttribute('stroke-opacity', '1');
          }
        }

        if (shape) marker.appendChild(shape);
        return marker;
      }

      function renderEdges() {
        edgesDefs.innerHTML = '';
        edgesLayer.innerHTML = '';
        edgeLabelsLayer.innerHTML = '';
        edgeHandlesLayer.innerHTML = '';

        // Preview marker matching default edge style & color
        const pCol = settings.defaultEdge.color || '#3b82f6';
        const pHead = settings.defaultEdge.endHead || 'triangle';
        if (pHead !== 'none') {
          edgesDefs.appendChild(createArrowMarker('preview-arrow-end', pHead, { fill: pCol, outline: null, hollowStroke: pCol }, false));
          previewEdgeEl.setAttribute('marker-end', 'url(#preview-arrow-end)');
        } else {
          previewEdgeEl.removeAttribute('marker-end');
        }
        previewEdgeEl.style.stroke = pCol;

        state.edges.forEach(edge => {
          const geom = buildEdgeGeometry(edge);
          const isSelected = edge.id === selectedEdgeId;
          const strokeColor = edge.color || '#64748b';
          const strokeW = edge.width || 2.5;
          const lineStyle = edge.lineStyle || (edge.dashed ? 'dashed' : 'solid');
          const startHead = edge.startHead || (edge.arrowStart ? 'triangle' : 'none');
          const endHead = edge.endHead || (edge.arrowEnd ? 'triangle' : 'none');
          const headColors = getEdgeHeadColors(edge);

          // Dynamic per-edge RGB markers
          const endMarkerId = `m-end-${edge.id}`;
          const startMarkerId = `m-start-${edge.id}`;
          if (endHead !== 'none') edgesDefs.appendChild(createArrowMarker(endMarkerId, endHead, headColors, false));
          if (startHead !== 'none') edgesDefs.appendChild(createArrowMarker(startMarkerId, startHead, headColors, true));

          const isGroupSelected = selectedNodeIds.size > 1 &&
            edge.from.nodeId && selectedNodeIds.has(edge.from.nodeId) &&
            edge.to.nodeId && selectedNodeIds.has(edge.to.nodeId);

          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          g.setAttribute('class', 'edge-group' + (isSelected ? ' selected' : '') + (isGroupSelected ? ' group-selected' : ''));
          g.dataset.id = edge.id;

          const glow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          glow.setAttribute('class', 'edge-glow');
          glow.setAttribute('d', geom.d);
          glow.setAttribute('stroke-width', String((lineStyle === 'double' ? strokeW * 2.35 : strokeW) + 8));

          const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          hit.setAttribute('class', 'edge-hit');
          hit.setAttribute('d', geom.d);

          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('class', 'edge-path');
          path.setAttribute('d', geom.d);
          path.setAttribute('stroke', strokeColor);

          let doubleGapPath = null;
          let markerCarrierPath = null;

          if (lineStyle === 'double') {
            path.setAttribute('stroke-width', String(strokeW * 2.35));
            path.setAttribute('stroke-linecap', 'butt');

            doubleGapPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            doubleGapPath.setAttribute('class', 'edge-path-double-gap');
            doubleGapPath.setAttribute('d', geom.d);
            doubleGapPath.setAttribute('stroke-width', String(Math.max(1.4, strokeW * 0.95)));

            if (endHead !== 'none' || startHead !== 'none') {
              markerCarrierPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
              markerCarrierPath.setAttribute('class', 'edge-path-markers');
              markerCarrierPath.setAttribute('d', geom.d);
              markerCarrierPath.setAttribute('stroke-width', String(strokeW));
              if (endHead !== 'none') markerCarrierPath.setAttribute('marker-end', `url(#${endMarkerId})`);
              if (startHead !== 'none') markerCarrierPath.setAttribute('marker-start', `url(#${startMarkerId})`);
            }
          } else {
            path.setAttribute('stroke-width', String(strokeW));
            if (lineStyle === 'dashed') {
              path.setAttribute('stroke-dasharray', `${Math.max(6, strokeW * 3.2)} ${Math.max(5, strokeW * 2.4)}`);
            } else if (lineStyle === 'dotted') {
              path.setAttribute('stroke-dasharray', `0.1 ${Math.max(5, strokeW * 2.3)}`);
            }
            if (endHead !== 'none') path.setAttribute('marker-end', `url(#${endMarkerId})`);
            if (startHead !== 'none') path.setAttribute('marker-start', `url(#${startMarkerId})`);
          }

          // Grabbing ANYWHERE on the arrow lets you stretch/bend it immediately!
          hit.addEventListener('pointerdown', (e) => {
            if (e.button !== 0) return;
            e.stopPropagation();
            if (connectMode) return;
            finishEditing();
            closeRgbPopover(true);
            selectEdge(edge.id);

            const pt = screenToWorld(e.clientX, e.clientY);

            // Check if pointer is very close to an existing waypoint
            let existingIdx = -1;
            edge.points.forEach((wp, idx) => {
              if (Math.hypot(wp.x - pt.x, wp.y - pt.y) < 16 / view.zoom) {
                existingIdx = idx;
              }
            });

            dragState = {
              type: 'edge-stretch',
              edgeId: edge.id,
              startClientX: e.clientX,
              startClientY: e.clientY,
              startWorld: pt,
              waypointIndex: existingIdx, // if -1, will insert on first real drag movement
              inserted: false,
              moved: false
            };
          });

          hit.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            if (connectMode) return;
            selectEdge(edge.id);
            const gNow = buildEdgeGeometry(edge);
            startEditingEdgeLabel(edge.id, gNow.midX, gNow.midY);
          });

          g.appendChild(glow);
          g.appendChild(hit);
          g.appendChild(path);
          if (doubleGapPath) g.appendChild(doubleGapPath);
          if (markerCarrierPath) g.appendChild(markerCarrierPath);
          edgesLayer.appendChild(g);

          // Edge label
          if (edge.label && edge.label.trim() !== '') {
            const lbl = document.createElement('div');
            lbl.className = 'edge-label' + (isSelected ? ' selected' : '');
            lbl.textContent = edge.label;
            lbl.style.left = geom.midX + 'px';
            lbl.style.top = geom.midY + 'px';
            lbl.style.color = strokeColor;
            lbl.addEventListener('pointerdown', (e) => {
              e.stopPropagation();
              if (connectMode) return;
              finishEditing();
              closeRgbPopover(true);
              selectEdge(edge.id);
            });
            lbl.addEventListener('dblclick', (e) => {
              e.stopPropagation();
              selectEdge(edge.id);
              startEditingEdgeLabel(edge.id, geom.midX, geom.midY);
            });
            edgeLabelsLayer.appendChild(lbl);
          }

          // Render quick-grab endpoint handles for unselected edges so any arrowhead/tail can be re-attached directly
          if (!isSelected) {
            renderEdgeEndpointHandle(edge, 'from', geom.start, false);
            renderEdgeEndpointHandle(edge, 'to', geom.end, false);
          }
        });

        // Render selected edge handles last so they always sit on top of everything else
        if (selectedEdgeId) {
          const selEdge = getEdge(selectedEdgeId);
          if (selEdge) {
            renderSelectedEdgeHandles(selEdge, buildEdgeGeometry(selEdge));
          }
        }
      }

      function renderEdgeEndpointHandle(edge, which, pt, isSelected) {
        const h = document.createElement('div');
        h.className = isSelected ? 'edge-handle endpoint' : 'edge-handle endpoint-quick';
        h.style.left = pt.x + 'px';
        h.style.top = pt.y + 'px';
        h.title = which === 'from'
          ? 'Потяните, чтобы перецепить начало стрелки к другому блоку или на доску'
          : 'Потяните, чтобы перецепить конец стрелки к другому блоку или на доску';
        h.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          if (e.button !== 0 || connectMode) return;
          finishEditing();
          closeRgbPopover(true);
          hideMagneticPort();
          if (selectedEdgeId !== edge.id) {
            selectEdge(edge.id);
          }
          dragState = {
            type: 'edge-end',
            edgeId: edge.id,
            which, // 'from' | 'to'
            startClientX: e.clientX,
            startClientY: e.clientY,
            moved: false
          };
        });
        edgeHandlesLayer.appendChild(h);
      }

      function renderSelectedEdgeHandles(edge, geom) {
        // Start & End handles (can re-anchor anywhere on any block or free space!)
        renderEdgeEndpointHandle(edge, 'from', geom.start, true);
        renderEdgeEndpointHandle(edge, 'to', geom.end, true);

        // Waypoint bend handles
        edge.points.forEach((wp, idx) => {
          const h = document.createElement('div');
          h.className = 'edge-handle waypoint';
          h.style.left = wp.x + 'px';
          h.style.top = wp.y + 'px';
          h.title = 'Тяните для изгиба · Двойной клик — удалить точку изгиба';
          h.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if (e.button !== 0 || connectMode) return;
            finishEditing();
            closeRgbPopover(true);
            hideMagneticPort();
            dragState = {
              type: 'edge-waypoint',
              edgeId: edge.id,
              index: idx,
              moved: false
            };
          });
          h.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            edge.points.splice(idx, 1);
            renderEdges();
            updateContextBars();
            pushHistory();
          });
          edgeHandlesLayer.appendChild(h);
        });
      }

      function renderAll() {
        renderNodes();
        renderEdges();
        updateContextBars();
      }

      // --- Magnetic Sliding Port ---
      function hideMagneticPort() {
        hoveredPort = null;
        magneticPortEl.style.display = 'none';
      }

      function isNearAnyEdgeEndpoint(wx, wy) {
        const selectedRadius = 24 / view.zoom;
        const quickRadius = 13 / view.zoom;
        for (const edge of state.edges) {
          const { start, end } = getEdgeEndpoints(edge);
          const r = edge.id === selectedEdgeId ? selectedRadius : quickRadius;
          if (
            Math.hypot(wx - start.x, wy - start.y) <= r ||
            Math.hypot(wx - end.x, wy - end.y) <= r
          ) {
            return true;
          }
        }
        return false;
      }

      function updateMagneticPort(clientX, clientY) {
        if (
          dragState ||
          editingNodeId ||
          connectMode ||
          rgbPopover.classList.contains('visible') ||
          edgeStylePopover.classList.contains('visible') ||
          nodeShapePopover.classList.contains('visible')
        ) {
          hideMagneticPort();
          return;
        }
        // Ignore if hovering UI bars or any edge handle (re-attaching arrows has priority)
        const topEl = document.elementFromPoint(clientX, clientY);
        if (
          topEl &&
          (topEl.closest('.toolbar') ||
           topEl.closest('.corner-settings') ||
           topEl.closest('.context-bar') ||
           topEl.closest('.zoom-controls') ||
           topEl.closest('.rgb-popover') ||
           topEl.closest('.style-popover') ||
           topEl.closest('.shape-popover') ||
           topEl.closest('.edge-handle'))
        ) {
          hideMagneticPort();
          return;
        }

        const pt = screenToWorld(clientX, clientY);

        // Suppress new-arrow port near arrow start/end points so re-attaching is never blocked
        if (isNearAnyEdgeEndpoint(pt.x, pt.y)) {
          hideMagneticPort();
          return;
        }

        // Keep port visible when hovering right over itself
        if (topEl === magneticPortEl && hoveredPort) {
          return;
        }
        const margin = 16 / view.zoom;
        const snap = findSnapNodePerimeter(pt.x, pt.y, margin);

        if (!snap) {
          hideMagneticPort();
          return;
        }

        // Hide if user is hovering the resize corner of that node
        const node = getNode(snap.nodeId);
        if (node) {
          const { w, h } = getNodeSize(node);
          const nearResize = Math.hypot(pt.x - (node.x + w), pt.y - (node.y + h)) < 18 / view.zoom;
          if (nearResize) {
            hideMagneticPort();
            return;
          }
        }

        hoveredPort = snap;
        magneticPortEl.style.left = snap.x + 'px';
        magneticPortEl.style.top = snap.y + 'px';
        magneticPortEl.style.display = 'block';
      }

      magneticPortEl.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        if (e.button !== 0 || !hoveredPort) return;
        finishEditing();
        closeRgbPopover(true);
        const src = { ...hoveredPort };
        hideMagneticPort();
        dragState = {
          type: 'new-edge',
          from: { nodeId: src.nodeId, side: src.side, t: src.t, u: src.u, x: src.x, y: src.y },
          startPt: src,
          snapTarget: null
        };
        updateNewEdgePreview(e.clientX, e.clientY);
        updateContextBars();
      });

      function showSnapIndicator(snap) {
        nodesLayer.querySelectorAll('.node.drop-target').forEach(el => el.classList.remove('drop-target'));
        if (snap) {
          const el = nodesLayer.querySelector(`.node[data-id="${snap.nodeId}"]`);
          if (el) el.classList.add('drop-target');
          snapIndicatorEl.style.left = snap.x + 'px';
          snapIndicatorEl.style.top = snap.y + 'px';
          snapIndicatorEl.style.display = 'block';
        } else {
          snapIndicatorEl.style.display = 'none';
        }
      }

      function updateNewEdgePreview(clientX, clientY) {
        if (!dragState || dragState.type !== 'new-edge') return;
        const pt = screenToWorld(clientX, clientY);
        const snap = findSnapNodePerimeter(pt.x, pt.y, 20 / view.zoom);
        dragState.snapTarget = snap;
        showSnapIndicator(snap);

        const start = dragState.startPt;
        const end = snap ? { x: snap.x, y: snap.y, nx: snap.nx, ny: snap.ny } : { x: pt.x, y: pt.y, nx: 0, ny: 0 };

        const dist = Math.hypot(end.x - start.x, end.y - start.y);
        const offset = Math.min(110, Math.max(28, dist * 0.35));
        const cp1x = start.x + start.nx * offset;
        const cp1y = start.y + start.ny * offset;
        const cp2x = end.nx || end.ny ? end.x + end.nx * offset : end.x;
        const cp2y = end.nx || end.ny ? end.y + end.ny * offset : end.y;

        previewEdgeEl.setAttribute('d', `M ${start.x} ${start.y} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${end.x} ${end.y}`);
        previewEdgeEl.style.display = 'block';
      }

      // --- Selection & Context Bars ---
      function selectSingleNode(id) {
        selectedNodeIds.clear();
        selectedNodeIds.add(id);
        selectedEdgeId = null;
        syncSelectionVisuals();
        renderEdges();
        updateContextBars();
      }

      function selectEdge(id) {
        if (selectedEdgeId === id && selectedNodeIds.size === 0) {
          updateContextBars();
          return;
        }
        selectedEdgeId = id;
        selectedNodeIds.clear();
        syncSelectionVisuals();
        renderEdges();
        updateContextBars();
      }

      function clearSelection() {
        selectedNodeIds.clear();
        selectedEdgeId = null;
        syncSelectionVisuals();
        renderEdges();
        updateContextBars();
      }

      function updateContextBars() {
        nodeCtxBar.classList.remove('visible');
        edgeCtxBar.classList.remove('visible');

        if (dragState && dragState.type !== 'pan') return;

        if (selectedNodeIds.size > 0 && !editingNodeId) {
          // Compute bounding box of selected nodes
          let minX = Infinity, maxX = -Infinity, minY = Infinity;
          let firstNode = null;
          selectedNodeIds.forEach(id => {
            const n = getNode(id);
            if (!n) return;
            if (!firstNode) firstNode = n;
            const { w } = getNodeSize(n);
            minX = Math.min(minX, n.x);
            maxX = Math.max(maxX, n.x + w);
            minY = Math.min(minY, n.y);
          });
          if (!firstNode) return;

          const pos = worldToScreen((minX + maxX) / 2, minY);
          const barX = clamp(pos.x, 195, window.innerWidth - 195);
          const barY = Math.max(115, pos.y - 12);

          nodeCtxBar.style.left = barX + 'px';
          nodeCtxBar.style.top = barY + 'px';

          const shapeInfo = SHAPE_MAP[firstNode.shape || 'card'] || SHAPE_MAP.card;
          document.getElementById('ctx-node-shape-label').textContent = shapeInfo.label;
          document.getElementById('ctx-node-rot').classList.toggle('active', !!firstNode.rotate);
          document.getElementById('ctx-node-flipx').classList.toggle('active', !!firstNode.flipX);
          document.getElementById('ctx-node-flipy').classList.toggle('active', !!firstNode.flipY);

          document.getElementById('swatch-node-bg').style.background = firstNode.bgColor;
          document.getElementById('swatch-node-text').style.background = firstNode.textColor;
          document.getElementById('ctx-font-val').textContent = firstNode.fontSize;
          document.getElementById('ctx-node-connect').style.display = selectedNodeIds.size === 1 ? 'inline-flex' : 'none';

          const attachedEdges = getEdgesForSelectedNodes('all');
          const nodeEdgesBtn = document.getElementById('ctx-node-edges');
          if (attachedEdges.length > 0) {
            nodeEdgesBtn.style.display = 'inline-flex';
            document.getElementById('swatch-node-edges').style.background = attachedEdges[0].color || '#64748b';
          } else {
            nodeEdgesBtn.style.display = 'none';
          }

          nodeCtxBar.classList.add('visible');
        } else if (selectedEdgeId) {
          const edge = getEdge(selectedEdgeId);
          if (!edge) return;
          const geom = buildEdgeGeometry(edge);
          const pos = worldToScreen(geom.midX, geom.midY);
          const barX = clamp(pos.x, 240, window.innerWidth - 240);
          const barY = Math.max(115, pos.y - 18);

          edgeCtxBar.style.left = barX + 'px';
          edgeCtxBar.style.top = barY + 'px';

          const routeKey = edge.curveType || 'smooth';
          const lineKey = edge.lineStyle || (edge.dashed ? 'dashed' : 'solid');
          const sHead = edge.startHead || (edge.arrowStart ? 'triangle' : 'none');
          const eHead = edge.endHead || (edge.arrowEnd ? 'triangle' : 'none');

          document.getElementById('swatch-edge-color').style.background = edge.color;
          document.getElementById('ctx-edge-w-val').textContent = edge.width;
          document.getElementById('ctx-edge-curve').textContent = (ROUTE_LABELS[routeKey] || 'Плавная') + ' ▾';
          document.getElementById('ctx-edge-style').textContent = (LINE_STYLE_LABELS[lineKey] || 'Сплошная') + ' ▾';
          document.getElementById('ctx-edge-heads').textContent =
            `${HEAD_START_SYMBOLS[sHead] || '—'} ${HEAD_END_SYMBOLS[eHead] || '▶'} ▾`;
          document.getElementById('ctx-edge-straighten').style.display = edge.points.length > 0 ? 'inline-flex' : 'none';

          edgeCtxBar.classList.add('visible');
        }
      }

      function getEdgesForSelectedNodes(scope = 'all') {
        if (selectedNodeIds.size === 0) return [];
        return state.edges.filter(e => {
          const fromIn = !!(e.from.nodeId && selectedNodeIds.has(e.from.nodeId));
          const toIn = !!(e.to.nodeId && selectedNodeIds.has(e.to.nodeId));
          return scope === 'internal' ? (fromIn && toIn) : (fromIn || toIn);
        });
      }

      function setRgbTabs(tabs, activeSub) {
        rgbTabs.innerHTML = '';
        if (!tabs || tabs.length === 0) {
          rgbTabs.style.display = 'none';
          return;
        }
        rgbTabs.style.display = 'flex';
        tabs.forEach(({ sub, label }) => {
          const btn = document.createElement('button');
          btn.className = 'rgb-tab' + (sub === activeSub ? ' active' : '');
          btn.dataset.sub = sub;
          btn.textContent = label;
          btn.addEventListener('click', () => {
            if (!rgbTarget) return;
            rgbTarget.sub = sub;
            rgbTabs.querySelectorAll('.rgb-tab').forEach(t => t.classList.toggle('active', t === btn));
            if (rgbTarget.kind === 'default-node') {
              rgbAutoRow.style.display = sub === 'textColor' ? 'none' : 'flex';
              renderRgbPresets(sub === 'textColor' ? PRESETS_TEXT_EDGE : PRESETS_BG);
            }
            syncRgbPopoverUI(getCurrentRgbTargetColor());
          });
          rgbTabs.appendChild(btn);
        });
      }

      // --- RGB Color Picker Logic ---
      function isDefaultRgbTarget() {
        return !!(rgbTarget && (rgbTarget.kind === 'default-node' || rgbTarget.kind === 'default-edge'));
      }

      function commitRgbChange() {
        if (isDefaultRgbTarget()) {
          saveToStorage();
        } else {
          pushHistory();
        }
        rgbDirty = false;
      }

      function getCurrentRgbTargetColor() {
        if (!rgbTarget) return '#ffffff';
        if (rgbTarget.kind === 'default-node') {
          return settings.defaultNode[rgbTarget.sub] || '#ffffff';
        }
        if (rgbTarget.kind === 'default-edge') {
          return settings.defaultEdge.color || '#64748b';
        }
        if (rgbTarget.kind === 'edge') {
          const e = getEdge(selectedEdgeId);
          return e ? e.color : '#64748b';
        }
        if (rgbTarget.kind === 'node-edges') {
          const edges = getEdgesForSelectedNodes(rgbTarget.sub || 'all');
          return edges.length > 0 ? (edges[0].color || '#64748b') : '#64748b';
        }
        const firstId = Array.from(selectedNodeIds)[0];
        const n = getNode(firstId);
        if (!n) return '#ffffff';
        return n[rgbTarget.sub] || '#ffffff';
      }

      function applyColorToTarget(hex) {
        if (!rgbTarget) return;
        rgbDirty = true;

        if (rgbTarget.kind === 'default-node') {
          if (rgbTarget.sub === 'bgColor') {
            settings.defaultNode.bgColor = hex;
            if (settings.defaultNode.autoBorder) {
              settings.defaultNode.borderColor = deriveBorderColor(hex);
            }
          } else if (rgbTarget.sub === 'borderColor') {
            settings.defaultNode.borderColor = hex;
            settings.defaultNode.autoBorder = false;
            rgbAutoBorder.checked = false;
          } else if (rgbTarget.sub === 'textColor') {
            settings.defaultNode.textColor = hex;
          }
          syncToolbarDefaultsUI();
        } else if (rgbTarget.kind === 'default-edge') {
          settings.defaultEdge.color = hex;
          syncToolbarDefaultsUI();
          renderEdges();
        } else if (rgbTarget.kind === 'edge') {
          const edge = getEdge(selectedEdgeId);
          if (!edge) return;
          edge.color = hex;
          renderEdges();
          document.getElementById('swatch-edge-color').style.background = hex;
        } else if (rgbTarget.kind === 'node-edges') {
          const edges = getEdgesForSelectedNodes(rgbTarget.sub || 'all');
          if (edges.length === 0) return;
          edges.forEach(edge => { edge.color = hex; });
          renderEdges();
          document.getElementById('swatch-node-edges').style.background = hex;
        } else {
          selectedNodeIds.forEach(id => {
            const node = getNode(id);
            if (!node) return;
            if (rgbTarget.sub === 'bgColor') {
              node.bgColor = hex;
              if (node.autoBorder) {
                node.borderColor = deriveBorderColor(hex);
              }
            } else if (rgbTarget.sub === 'borderColor') {
              node.borderColor = hex;
              node.autoBorder = false;
              rgbAutoBorder.checked = false;
            } else if (rgbTarget.sub === 'textColor') {
              node.textColor = hex;
            }
            const el = nodesLayer.querySelector(`.node[data-id="${node.id}"]`);
            if (el) applyNodeStyles(el, node);
          });
          const first = getNode(Array.from(selectedNodeIds)[0]);
          if (first) {
            document.getElementById('swatch-node-bg').style.background = first.bgColor;
            document.getElementById('swatch-node-text').style.background = first.textColor;
          }
          if (settings.headColorFromSource && (rgbTarget.sub === 'bgColor' || rgbTarget.sub === 'borderColor')) {
            renderEdges();
          }
        }
      }

      function syncRgbPopoverUI(hex) {
        const { r, g, b } = hexToRgb(hex);
        const norm = rgbToHex(r, g, b);
        rgbR.value = r; rgbRNum.value = r;
        rgbG.value = g; rgbGNum.value = g;
        rgbB.value = b; rgbBNum.value = b;
        rgbNative.value = norm;
        rgbHex.value = norm.toUpperCase();

        // Dynamic live RGB slider tracks!
        rgbR.style.background = `linear-gradient(to right, rgb(0,${g},${b}), rgb(255,${g},${b}))`;
        rgbG.style.background = `linear-gradient(to right, rgb(${r},0,${b}), rgb(${r},255,${b}))`;
        rgbB.style.background = `linear-gradient(to right, rgb(${r},${g},0), rgb(${r},${g},255))`;
      }

      function closeNodeShapePopover() {
        if (!nodeShapePopover.classList.contains('visible')) return;
        nodeShapePopover.classList.remove('visible');
        shapePopoverMode = null;
        document.getElementById('ctx-node-shape').classList.remove('active');
        btnDefNodeShape.classList.remove('active');
      }

      function makeShapePreviewSvg(shapeKey) {
        const w = 34, h = 22;
        const spec = buildShapeSpec(shapeKey, w, h, 1.5);
        let paths = '';
        for (const f of spec.fills) {
          const join = f.lineJoin || 'round';
          const strokeAttr = f.stroke === false ? 'stroke="none"' : `stroke="currentColor" stroke-width="1.5" stroke-linejoin="${join}"`;
          paths += `<path d="${f.d}" fill="#ffffff" ${strokeAttr}/>`;
        }
        for (const s of spec.strokes) {
          const dashAttr = s.dashed ? 'stroke-dasharray="3 2.5"' : '';
          paths += `<path d="${s.d}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" ${dashAttr}/>`;
        }
        return `<svg viewBox="0 0 ${w} ${h}" fill="none">${paths}</svg>`;
      }

      function setSelectedNodesShape(shapeKey) {
        if (selectedNodeIds.size === 0 || !VALID_SHAPES.includes(shapeKey)) return;
        selectedNodeIds.forEach(id => {
          const n = getNode(id);
          if (!n) return;
          n.shape = shapeKey;
          const el = nodesLayer.querySelector(`.node[data-id="${n.id}"]`);
          if (el) applyNodeStyles(el, n);
        });
        renderEdges();
        updateContextBars();
        pushHistory();
      }

      function rotateSelectedNodes(deltaDeg = 90) {
        if (selectedNodeIds.size === 0) return;
        const step = deltaDeg >= 0 ? 90 : 270;
        selectedNodeIds.forEach(id => {
          const n = getNode(id);
          if (!n) return;
          const { w: curW, h: curH } = getNodeSize(n);
          const cx = n.x + curW / 2;
          const cy = n.y + curH / 2;
          n.rotate = ((n.rotate || 0) + step) % 360;
          const minW = (n.shape === 'connector' || n.shape === 'offpage') ? 54 : 76;
          n.w = Math.max(minW, Math.round(curH));
          n.h = Math.max(44, Math.round(curW));
          n.x = Math.round(cx - n.w / 2);
          n.y = Math.round(cy - n.h / 2);
          const el = nodesLayer.querySelector(`.node[data-id="${n.id}"]`);
          if (el) applyNodeStyles(el, n);
        });
        renderEdges();
        updateContextBars();
        pushHistory();
      }

      function flipSelectedNodes(axis) {
        if (selectedNodeIds.size === 0) return;
        selectedNodeIds.forEach(id => {
          const n = getNode(id);
          if (!n) return;
          if (axis === 'x') n.flipX = !n.flipX;
          else n.flipY = !n.flipY;
          const el = nodesLayer.querySelector(`.node[data-id="${n.id}"]`);
          if (el) applyNodeStyles(el, n);
        });
        renderEdges();
        updateContextBars();
        pushHistory();
      }

      function resetSelectedTransforms() {
        if (selectedNodeIds.size === 0) return;
        selectedNodeIds.forEach(id => {
          const n = getNode(id);
          if (!n) return;
          const wasSwapped = ((n.rotate || 0) % 180) !== 0;
          if (wasSwapped) {
            const { w: curW, h: curH } = getNodeSize(n);
            const cx = n.x + curW / 2;
            const cy = n.y + curH / 2;
            n.w = Math.max(76, Math.round(curH));
            n.h = Math.max(44, Math.round(curW));
            n.x = Math.round(cx - n.w / 2);
            n.y = Math.round(cy - n.h / 2);
          }
          n.rotate = 0;
          n.flipX = false;
          n.flipY = false;
          const el = nodesLayer.querySelector(`.node[data-id="${n.id}"]`);
          if (el) applyNodeStyles(el, n);
        });
        renderEdges();
        updateContextBars();
        pushHistory();
      }

      function renderNodeShapePopoverContents() {
        const isDefault = shapePopoverMode === 'default';
        nodeShapePopover.innerHTML = '';

        let curShape;
        if (isDefault) {
          curShape = settings.defaultNode.shape || 'process';
        } else {
          const first = getNode(Array.from(selectedNodeIds)[0]);
          if (!first) return;
          curShape = first.shape || 'card';
          const hasTransform = !!(first.rotate || first.flipX || first.flipY);

          // Transform controls row (for selected blocks)
          const tRow = document.createElement('div');
          tRow.className = 'shape-transform-row';

          const makeTBtn = (text, title, active, disabled, onClick) => {
            const b = document.createElement('button');
            b.className = 'shape-tbtn' + (active ? ' active' : '');
            b.textContent = text;
            b.title = title;
            b.disabled = !!disabled;
            b.addEventListener('click', () => {
              onClick();
              renderNodeShapePopoverContents();
            });
            return b;
          };

          tRow.appendChild(makeTBtn('↺ -90°', 'Повернуть на 90° против часовой', false, false, () => rotateSelectedNodes(-90)));
          tRow.appendChild(makeTBtn('↻ +90°', 'Повернуть на 90° по часовой', !!first.rotate, false, () => rotateSelectedNodes(90)));
          tRow.appendChild(makeTBtn('⇄ Зерк.', 'Отзеркалить по горизонтали', !!first.flipX, false, () => flipSelectedNodes('x')));
          tRow.appendChild(makeTBtn('⇅ Перев.', 'Отзеркалить по вертикали', !!first.flipY, false, () => flipSelectedNodes('y')));
          tRow.appendChild(makeTBtn('Сброс', 'Сбросить поворот и отражение', false, !hasTransform, resetSelectedTransforms));
          nodeShapePopover.appendChild(tRow);
        }

        const title = document.createElement('div');
        title.className = 'style-pop-title';
        title.textContent = isDefault ? 'Форма новых блоков (ГОСТ 19.701-90)' : 'Формы блоков (ГОСТ 19.701-90)';
        nodeShapePopover.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'shape-grid';
        GOST_SHAPES.forEach(sh => {
          const btn = document.createElement('button');
          btn.className = 'shape-opt-btn' + (curShape === sh.key ? ' active' : '');
          btn.title = sh.desc;
          btn.innerHTML = `${makeShapePreviewSvg(sh.key)}<span>${sh.label}</span>`;
          btn.addEventListener('click', () => {
            if (isDefault) {
              settings.defaultNode.shape = sh.key;
              syncToolbarDefaultsUI();
              saveToStorage();
              closeNodeShapePopover();
              showToast(`Форма новых блоков: ${sh.label}`);
            } else {
              setSelectedNodesShape(sh.key);
              renderNodeShapePopoverContents();
            }
          });
          grid.appendChild(btn);
        });
        nodeShapePopover.appendChild(grid);
      }

      function openNodeShapePopover(anchorBtn, mode = 'selected') {
        hideMagneticPort();
        closeEdgeStylePopover();
        if (nodeShapePopover.classList.contains('visible') && shapePopoverMode === mode) {
          closeNodeShapePopover();
          return;
        }
        closeRgbPopover(true);
        if (mode === 'selected' && selectedNodeIds.size === 0) return;
        shapePopoverMode = mode;
        anchorBtn.classList.add('active');
        renderNodeShapePopoverContents();
        positionPopoverNearButton(nodeShapePopover, anchorBtn);
      }

      function closeEdgeStylePopover() {
        if (!edgeStylePopover.classList.contains('visible')) return;
        edgeStylePopover.classList.remove('visible');
        edgeStyleMode = null;
        document.getElementById('ctx-edge-curve').classList.remove('active');
        document.getElementById('ctx-edge-style').classList.remove('active');
        document.getElementById('ctx-edge-heads').classList.remove('active');
        btnDefEdgeStyle.classList.remove('active');
      }

      function positionPopoverNearButton(popEl, anchorBtn) {
        popEl.style.visibility = 'hidden';
        popEl.classList.add('visible');
        const popW = popEl.offsetWidth || 220;
        const popH = popEl.offsetHeight || 160;
        const rect = anchorBtn.getBoundingClientRect();
        const left = clamp(rect.left + rect.width / 2 - popW / 2, 12, window.innerWidth - popW - 12);
        let top = rect.bottom + 10;
        if (top + popH > window.innerHeight - 12) {
          top = Math.max(12, rect.top - popH - 10);
        }
        popEl.style.left = left + 'px';
        popEl.style.top = top + 'px';
        popEl.style.visibility = '';
      }

      function getHeadIconSvg(headType, isStart) {
        const line = isStart
          ? '<line x1="25" y1="9" x2="10" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
          : '<line x1="3" y1="9" x2="18" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
        if (headType === 'none') {
          return '<svg viewBox="0 0 28 18" fill="none"><line x1="4" y1="9" x2="24" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
        }
        if (headType === 'triangle') {
          const tri = isStart
            ? '<polygon points="4,9 13,4.5 13,13.5" fill="currentColor"/>'
            : '<polygon points="24,9 15,4.5 15,13.5" fill="currentColor"/>';
          return `<svg viewBox="0 0 28 18" fill="none">${line}${tri}</svg>`;
        }
        if (headType === 'hollow-triangle') {
          const tri = isStart
            ? '<polygon points="4.5,9 13,4.8 13,13.2" fill="#ffffff" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>'
            : '<polygon points="23.5,9 15,4.8 15,13.2" fill="#ffffff" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>';
          return `<svg viewBox="0 0 28 18" fill="none">${line}${tri}</svg>`;
        }
        if (headType === 'diamond') {
          const dm = isStart
            ? '<polygon points="3.5,9 9,5 14.5,9 9,13" fill="currentColor"/>'
            : '<polygon points="13.5,9 19,5 24.5,9 19,13" fill="currentColor"/>';
          return `<svg viewBox="0 0 28 18" fill="none">${line}${dm}</svg>`;
        }
        // circle
        const circ = isStart
          ? '<circle cx="8" cy="9" r="3.8" fill="currentColor"/>'
          : '<circle cx="20" cy="9" r="3.8" fill="currentColor"/>';
        return `<svg viewBox="0 0 28 18" fill="none">${line}${circ}</svg>`;
      }

      function openEdgeStylePopover(mode, anchorBtn) {
        hideMagneticPort();
        if (edgeStylePopover.classList.contains('visible') && edgeStyleMode === mode) {
          closeEdgeStylePopover();
          return;
        }
        closeRgbPopover(true);

        if (mode === 'default-edge') {
          edgeStyleMode = mode;
          anchorBtn.classList.add('active');
          edgeStylePopover.innerHTML = '';

          const de = settings.defaultEdge;

          // 1. Route section
          const routeItems = [
            { key: 'smooth',     label: 'Плавная', svg: '<svg viewBox="0 0 34 18" fill="none"><path d="M 2 14 C 14 14, 20 4, 32 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>' },
            { key: 'straight',   label: 'Ломаная', svg: '<svg viewBox="0 0 34 18" fill="none"><path d="M 2 14 L 17 9 L 32 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
            { key: 'orthogonal', label: '90° ступ.', svg: '<svg viewBox="0 0 34 18" fill="none"><path d="M 2 14 L 17 14 L 17 4 L 32 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' }
          ];
          const routeSec = document.createElement('div');
          routeSec.className = 'style-pop-section';
          routeSec.innerHTML = '<div class="style-pop-title">Маршрут новых стрелок</div>';
          const routeGrid = document.createElement('div');
          routeGrid.className = 'style-compact-grid-3';
          routeItems.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'style-chip-btn' + (de.curveType === item.key ? ' active' : '');
            btn.innerHTML = `${item.svg}<span>${item.label}</span>`;
            btn.addEventListener('click', () => {
              de.curveType = item.key;
              routeGrid.querySelectorAll('.style-chip-btn').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              syncToolbarDefaultsUI();
              saveToStorage();
            });
            routeGrid.appendChild(btn);
          });
          routeSec.appendChild(routeGrid);
          edgeStylePopover.appendChild(routeSec);

      // --- Editing Node Text ---
      function startEditingNode(id) {

        const input = document.createElement('input');

        input.style.top = midY + 'px';

        const commit = () => {
          if (committed) return;
          committed = true;
          edge.label = input.value.trim();
          input.remove();
          renderEdges();
          pushHistory();

        input.addEventListener('blur', commit);
        input.addEventListener('keydown', (e) => {

            committed = true;
